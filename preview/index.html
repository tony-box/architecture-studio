<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture Studio</title>
<style>
  /* Viewer chrome tokens. See references/viewer-chrome.md. Drawing sheets carry their own
     drafting styles inline (references/drafting-standard.md) and never read these. */
  :root {
    --paper: #f3f0e8;
    --sheet: #fbfaf6;
    --panel: #ebe7dd;
    --ink: #1f2420;
    --muted: #4f5650;
    --line: #d3d0c6;
    --control-line: #767b75;
    --accent: #b64b34;
    --canvas: #dcdad3;
    --error: #a22e2e;
    --warning: #7d5208;
    --advisory: #3f5660;
    --sans: "Aptos", "Segoe UI", system-ui, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --mono: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
    --control-h: 36px;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
  }
  @media (pointer: coarse), (max-width: 900px) { :root { --control-h: 44px; } }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body { overflow: hidden; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .hidden-view { display: none !important; }

  .app { display: grid; grid-template-rows: auto minmax(0, 1fr); width: 100%; height: 100%; min-width: 0; }
  .masthead { display: flex; align-items: stretch; min-width: 0; border-bottom: 1px solid var(--line); background: var(--sheet); }
  .brand { display: flex; flex-direction: column; justify-content: center; gap: 2px; width: 260px; flex: none; padding: 8px 18px; border-right: 1px solid var(--line); min-width: 0; }
  .brand strong { overflow: hidden; font: 600 18px/1.2 var(--serif); text-overflow: ellipsis; white-space: nowrap; }
  .brand span { color: var(--muted); font-size: 12px; }
  .tabs { display: flex; flex: 1 1 auto; align-items: stretch; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
  /* Drawing sheets lead on the left; the model and review pages sit at the right edge. */
  .tab-cluster { display: flex; align-items: stretch; flex: none; }
  .tab-cluster--review { margin-left: auto; border-left: 1px solid var(--line); }
  .tab {
    position: relative; flex: none; min-height: 54px; padding: 0 16px; border: 0; border-right: 1px solid var(--line);
    background: transparent; color: var(--muted); font-weight: 600; font-size: 14px;
    transition: background-color 160ms var(--ease), color 160ms var(--ease);
  }
  .tab:hover { color: var(--ink); background: #f1eee6; }
  .tab[hidden] { display: none; }
  .tab[aria-selected="true"] { color: var(--ink); background: var(--paper); }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; inset: auto 0 -1px; height: 3px; background: var(--accent); }
  .tab:focus-visible { outline-offset: -3px; }
  .tab-cluster--review .tab { border-right: 0; border-left: 1px solid var(--line); }
  .tab-cluster--review .tab:first-child { border-left: 0; }

  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 0; }
  .stage { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--paper); }
  .field { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  /* Related controls fuse into one segmented control so each group reads as a single tool. */
  .group { display: flex; align-items: center; gap: 0; }
  .group > .tool { position: relative; margin-left: -1px; border-radius: 0; }
  .group > .tool:first-child { margin-left: 0; border-radius: 4px 0 0 4px; }
  .group > .tool:last-child { border-radius: 0 4px 4px 0; }
  .group > .tool:hover, .group > .tool:focus-visible { z-index: 1; }
  .group > .tool[aria-pressed="true"] + .tool[aria-pressed="true"] { box-shadow: inset 1px 0 0 rgba(251, 250, 246, .4); }
  select, .tool {
    min-height: var(--control-h); border: 1px solid var(--control-line); border-radius: 4px;
    background: var(--sheet); padding: 0 12px; font-size: 14px;
    transition: background-color 160ms var(--ease), border-color 160ms var(--ease);
  }
  .tool.icon { min-width: var(--control-h); padding: 0; font-size: 18px; line-height: 1; }
  .tool:hover, select:hover { border-color: var(--ink); }
  .tool[aria-pressed="true"] { color: var(--sheet); background: var(--ink); border-color: var(--ink); }
  .tool[aria-pressed="false"] { color: var(--muted); }
  .tool.primary { margin-left: auto; color: var(--sheet); background: var(--ink); border-color: var(--ink); }
  .tool.primary:hover { background: #343b36; }
  .swatch { display: inline-block; width: 16px; height: 0; margin-right: 6px; border-top: 3px solid; vertical-align: middle; }

  .canvas-wrap { position: relative; min-height: 0; overflow: hidden; background: var(--canvas); }
  .sheet-viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
  .sheet-viewport.dragging { cursor: grabbing; }
  .sheet-viewport:focus-visible { outline-offset: -3px; }
  .sheet-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .sheet-stage svg { display: block; box-shadow: 0 2px 10px rgba(31, 36, 32, .18); }
  .sheet [data-entity] { cursor: pointer; outline: none; }
  .sheet [data-entity]:hover > :not(text), .sheet [data-entity]:hover:not(g) { stroke: var(--accent) !important; }
  .sheet [data-entity].is-selected > :not(text), .sheet [data-entity].is-selected:not(g),
  .sheet [data-entity]:focus-visible > :not(text), .sheet [data-entity]:focus-visible:not(g) { stroke: var(--accent) !important; stroke-width: 0.9px; }
  #model3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #dfe6e2; }
  #model3d:focus-visible { outline-offset: -3px; }
  #content { position: absolute; inset: 0; overflow: auto; padding: 32px clamp(20px, 5vw, 64px); background: var(--sheet); }
  .stage-status { position: absolute; inset: 0; display: grid; place-content: center; gap: 6px; padding: 24px; text-align: center; color: var(--muted); background: var(--canvas); }
  .stage-status strong { color: var(--ink); font: 600 20px/1.2 var(--serif); }
  .model-help { position: absolute; right: 14px; bottom: 14px; padding: 8px 10px; border: 1px solid var(--line); background: rgba(251, 250, 246, .94); color: var(--muted); font-size: 12px; }
  .toast { position: absolute; left: 14px; bottom: 14px; max-width: min(520px, calc(100% - 28px)); margin: 0; padding: 10px 12px; border: 1px solid var(--control-line); background: var(--sheet); color: var(--ink); font-size: 14px; }
  .toast:empty { display: none; }

  aside { min-width: 0; min-height: 0; overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); }
  .inspector { min-width: 0; padding: 20px; overflow-wrap: anywhere; }
  .inspector h2 { margin: 0 0 8px; font: 600 22px/1.15 var(--serif); }
  .inspector h3 { margin: 22px 0 8px; font-size: 14px; }
  .lede { margin: 0; color: var(--muted); font-size: 14px; }
  .metric { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; margin: 16px 0 0; }
  .metric dt { color: var(--muted); font-size: 14px; }
  .metric dd { margin: 0; font: 600 14px/1.45 var(--mono); text-align: right; }
  /* Inspector review queue: what needs the user's input, then informational notes. */
  .inspector .lede { margin-bottom: 16px; }
  .queue-heading { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 8px; font-size: 14px; }
  .queue-count { color: var(--muted); font: 600 12px/1 var(--mono); }
  .queue { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .queue-item { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--sheet); text-align: left; }
  button.queue-item:hover { border-color: var(--ink); }
  .queue-item__kind { grid-row: span 2; align-self: start; padding-top: 1px; color: var(--warning); font-weight: 700; font-size: 12px; }
  .queue-item--fix .queue-item__kind { color: var(--error); }
  .queue-item--note .queue-item__kind { color: var(--advisory); }
  .queue-item__title { font-weight: 600; }
  .queue-item__body { color: var(--muted); font-size: 12px; }
  .queue-notes { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .fineprint { margin: 22px 0 0; color: var(--muted); font-size: 12px; }
  /* Selected element: a detail callout with the measurements a reviewer looks for. */
  .entity-type { margin: 0 0 2px; color: var(--muted); font-size: 12px; }
  .entity-context { margin: 0; color: var(--muted); }
  .entity-detail { margin: 12px 0; padding: 10px; border: 1px solid var(--line); background: #fff; }
  .entity-detail svg { display: block; width: 100%; height: auto; }
  .entity-detail figcaption { margin-top: 6px; color: var(--muted); font-size: 12px; }
  .key-dims { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; margin: 14px 0 0; }
  .key-dims div { min-width: 0; }
  .key-dims dt { color: var(--muted); font-size: 12px; }
  .key-dims dd { margin: 0; font: 600 14px/1.3 var(--mono); overflow-wrap: anywhere; }
  .entity-subhead { margin: 18px 0 6px; font-size: 14px; }
  .open-items { margin: 0; padding-left: 18px; }
  .open-items li + li { margin-top: 4px; }
  .evidence-line { margin: 14px 0 0; color: var(--muted); font-size: 12px; }
  .approval { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .approval .tool.primary { width: 100%; margin-left: 0; }
  .approval__note { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
  .approval__state { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-weight: 600; }
  .approval__state span { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: var(--sheet); background: var(--ink); font-size: 13px; }
  .entity-actions { margin: 14px 0 0; }
  .diagnostics { display: grid; gap: 6px; }
  .finding { display: block; width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--sheet); text-align: left; }
  button.finding:hover { border-color: var(--ink); }
  .finding b { display: block; font-size: 12px; }
  .finding .severity { font-weight: 700; }
  .finding.error .severity { color: var(--error); }
  .finding.warning .severity { color: var(--warning); }
  .finding.advisory .severity { color: var(--advisory); }
  .finding > span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
  .disclaimer { margin-top: 18px; border: 1px solid #c8a97a; background: #f7edda; padding: 10px 11px; color: #5a4420; font-size: 12px; }
  .page { max-width: 880px; margin: 0 auto; }
  .page h1 { margin: 0 0 12px; font: 600 clamp(28px, 4vw, 44px)/1.05 var(--serif); max-width: 18ch; }
  .page h2 { margin: 30px 0 10px; font: 600 20px/1.15 var(--serif); }
  .page p { color: var(--muted); max-width: 70ch; }
  .page table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  .page th, .page td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: left; vertical-align: top; }
  .page th { color: var(--muted); font-size: 14px; }
  .page tr[data-entity] { cursor: pointer; }
  .page tr[data-entity]:hover { background: #f1eee6; }
  .page .finding { margin-top: 8px; }
  .empty { border: 1px dashed var(--control-line); padding: 18px; color: var(--muted); }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100%; }
    .masthead { flex-wrap: wrap; }
    .brand { width: 100%; border-right: 0; border-bottom: 1px solid var(--line); }
    .tabs { width: 100%; }
    .workspace { grid-template-columns: 1fr; }
    .stage { grid-template-rows: auto 62vh; }
    aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
    .tool.primary { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="brand"><strong id="project-name">Architecture Studio</strong><span id="project-meta">Loading the building model</span></div>
    <div class="tabs" role="tablist" aria-label="Studio views">
      <div class="tab-cluster">
        <button class="tab" role="tab" id="tab-plan" data-view="plan" aria-selected="true" aria-controls="stage" tabindex="0">Plans</button>
        <button class="tab" role="tab" id="tab-elevation" data-view="elevation" aria-selected="false" aria-controls="stage" tabindex="-1">Elevations</button>
        <button class="tab" role="tab" id="tab-section" data-view="section" aria-selected="false" aria-controls="stage" tabindex="-1">Sections</button>
        <button class="tab" role="tab" id="tab-systems" data-view="systems" aria-selected="false" aria-controls="stage" tabindex="-1">Systems</button>
        <button class="tab" role="tab" id="tab-site" data-view="site" aria-selected="false" aria-controls="stage" tabindex="-1" hidden>Site</button>
      </div>
      <div class="tab-cluster tab-cluster--review">
        <button class="tab" role="tab" id="tab-model" data-view="model" aria-selected="false" aria-controls="stage" tabindex="-1">3D model</button>
        <button class="tab" role="tab" id="tab-code" data-view="code" aria-selected="false" aria-controls="stage" tabindex="-1">Code review</button>
        <button class="tab" role="tab" id="tab-assumptions" data-view="assumptions" aria-selected="false" aria-controls="stage" tabindex="-1">Assumptions</button>
      </div>
    </div>
  </header>
  <div class="workspace">
    <section class="stage" id="stage" role="tabpanel" aria-labelledby="tab-plan">
      <div class="toolbar">
        <label class="field" id="level-control"><span>Level</span><select id="level"></select></label>
        <label class="field hidden-view" id="elevation-control"><span>Face</span><select id="elevation"><option value="north">North</option><option value="east">East</option><option value="south">South</option><option value="west">West</option></select></label>
        <label class="field hidden-view" id="section-control"><span>Section</span><select id="section"></select></label>
        <div class="group" id="zoom-controls" role="group" aria-label="Sheet zoom">
          <button class="tool icon" id="zoom-out" aria-label="Zoom out">&minus;</button>
          <button class="tool" id="zoom-fit">Fit sheet</button>
          <button class="tool icon" id="zoom-in" aria-label="Zoom in">+</button>
        </div>
        <div class="group hidden-view" id="camera-controls" role="group" aria-label="Camera">
          <button class="tool" id="mode-orbit" aria-pressed="true">Orbit</button>
          <button class="tool" id="mode-walk" aria-pressed="false">Walk</button>
        </div>
        <div class="group hidden-view" id="system-controls" role="group" aria-label="Systems shown">
          <button class="tool system-toggle" data-system="plumbing" aria-pressed="true"><span class="swatch" style="color:#1d5fa8"></span>Plumbing</button>
          <button class="tool system-toggle" data-system="electrical" aria-pressed="true"><span class="swatch" style="color:#9c2f8f"></span>Electrical</button>
          <button class="tool system-toggle" data-system="mechanical" aria-pressed="true"><span class="swatch" style="color:#1f7a4d"></span>Mechanical</button>
        </div>
        <button class="tool primary" id="download-set" aria-describedby="download-status">Download drawing set</button>
      </div>
      <div class="canvas-wrap">
        <div id="sheet-viewport" class="sheet-viewport" tabindex="0" role="region" aria-label="Drawing sheet. Arrow keys pan, plus and minus zoom, 0 fits the sheet."><div id="sheet-stage" class="sheet-stage sheet"></div></div>
        <canvas id="model3d" class="hidden-view" tabindex="0" aria-label="Interactive three-dimensional concept model. Arrow keys orbit, plus and minus zoom."></canvas>
        <article id="content" class="hidden-view"></article>
        <div id="model-help" class="model-help hidden-view">Drag or use arrow keys to look. Scroll or press plus and minus to zoom.<br>Walk mode: W A S D to move, Q and E to change height.</div>
        <div id="stage-status" class="stage-status"><strong>Loading the building model</strong><span>Reading models/building.json.</span></div>
        <p id="download-status" class="toast" role="status" aria-live="polite"></p>
      </div>
    </section>
    <aside aria-label="Inspector"><div class="inspector" id="inspector"><h2>Loading</h2><p class="lede">Reading the canonical building model.</p></div></aside>
  </div>
</div>

        if (!isModelPoint(v.c1) || !isModelPoint(v.c2)) issues.push('Bezier controls without both c1 and c2 as integer points');
      }
      if (last && isCurvedVertex(v)) issues.push('a curve on the last vertex of an open path');
      if (!last && isModelPoint(next) && next !== v && next.x === v.x && next.y === v.y) issues.push('coincident consecutive vertices');
    });
    return [...new Set(issues)];
  }
  // Issues of a closed boundary. Straight boundaries keep the legacy polygon checks exactly.
  function curveIssues(vertices, options = {}) {
    if (!Array.isArray(vertices) || !vertices.length) return ['fewer than three points'];
    if (!hasCurves(vertices)) return polygonIssues(vertices);
    if (vertices.length < 2) return ['fewer than two vertices'];
    const issues = vertexIssues(vertices, true, options);
    return issues.length ? issues : polygonIssues(curvePoints(vertices, true));
  }
  function pathIssues(vertices, closed, options = {}) {
    if (!Array.isArray(vertices) || vertices.length < 2) return ['fewer than two vertices'];
    const issues = vertexIssues(vertices, closed, options);
    if (issues.length) return issues;
    return closed ? polygonIssues(curvePoints(vertices, true)) : [];
  }

  function validateModel(model) {
    const findings = [];
    const add = (severity, code, message, entityId) => findings.push({ severity, code, message, entityId });
    if (model?.schemaVersion !== '1.0.0') add('error', 'schema.version', 'Expected schemaVersion 1.0.0.');
    if (!model?.project || typeof model.project.name !== 'string' || !model.project.coordinates || !model.project.jurisdiction) add('error', 'schema.project', 'Project metadata, coordinates, and jurisdiction are required.');
    const requiredArrays = ['levels', 'spaces', 'walls', 'openings', 'slabs', 'roofs', 'stairs', 'fixtures', 'equipment', 'systems', 'assumptions'];
    for (const key of requiredArrays) if (!Array.isArray(model?.[key])) add('error', 'schema.array', `${key} must be an array.`);
    if (findings.some(item => item.severity === 'error')) return findings;
    const ids = new Set(); let reviewEvidenceCount = 0;
    for (const entity of allEntityIds(model)) {
      if (!entity?.id) { add('error', 'entity.id', 'An entity is missing its stable ID.'); continue; }
      if (ids.has(entity.id)) add('error', 'entity.duplicate', `Duplicate entity ID: ${entity.id}`, entity.id);
      ids.add(entity.id);
      if (entity.evidence?.confidence < 0.75 || entity.evidence?.status === 'needs-review') reviewEvidenceCount += 1;
    }
    if (reviewEvidenceCount > 0) add('advisory', 'evidence.review', `${reviewEvidenceCount} entities carry low-confidence or needs-review evidence.`, model.project?.id);
    const levels = new Map((model.levels ?? []).map(level => [level.id, level]));
    const walls = new Map((model.walls ?? []).map(wall => [wall.id, wall]));
    const tolerance = model.project.coordinates.toleranceMm ?? 3;
    const elevations = new Set();
    for (const level of model.levels) {
      if (!isFiniteInteger(level.elevationMm)) add('error', 'level.elevation', 'Level elevation must be an integer millimeter value.', level.id);
      if (elevations.has(level.elevationMm)) add('error', 'level.duplicate-elevation', `Multiple levels use elevation ${level.elevationMm} mm.`, level.id);
      elevations.add(level.elevationMm);
    }
    for (const entity of [...model.spaces, ...model.walls, ...model.slabs, ...model.fixtures, ...model.equipment, ...model.roofs]) {
      if (!levels.has(entity.levelId)) add('error', 'reference.level', `Unknown level ${entity.levelId}.`, entity.id);
    }
    for (const entity of [...model.spaces, ...model.slabs, ...model.roofs]) {
      const points = entity.boundary ?? entity.footprint;
      const issues = entity.footprint ? polygonIssues(points) : curveIssues(points);
      if (issues.length) add('error', 'polygon.geometry', `Polygon has ${issues.join(', ')}.`, entity.id);
    }
    if (model.roofs.length > 1) add('error', 'renderer.unsupported-roofs', 'The studio renders one roof only.');
    for (const roof of model.roofs) {
      if (roof.kind !== 'gable' || !rectangleBounds(roof.footprint)) add('error', 'renderer.unsupported-roof', 'The studio renders one axis-aligned rectangular gable roof only.', roof.id);
      if (roof.ridgeElevationMm <= roof.eaveElevationMm) add('error', 'roof.geometry', 'Roof ridge must be above its eave.', roof.id);
    }
    for (const wall of model.walls ?? []) {
      const length = wallLength(wall);
      if (length < 1 || !isFiniteInteger(wall.thicknessMm) || wall.thicknessMm < 1 || !isFiniteInteger(wall.heightMm) || wall.heightMm < 1) add('error', 'wall.geometry', 'Wall has invalid length, thickness, or height.', wall.id);
      if (wall.bulge != null) {
        if (typeof wall.bulge !== 'number' || !Number.isFinite(wall.bulge) || wall.bulge === 0 || Math.abs(wall.bulge) > 1) add('error', 'wall.arc', 'An arc wall bulge must be a non-zero number no larger than 1 (a semicircle).', wall.id);
        else if (wallGeometry(wall).radius <= wall.thicknessMm / 2 + 50) add('error', 'wall.arc', 'The arc is too tight for the wall thickness; its radius must exceed half the thickness by at least 50 mm.', wall.id);
      }
    }
    for (const opening of model.openings ?? []) {
      const wall = walls.get(opening.wallId);
      if (!wall) { add('error', 'reference.wall', `Unknown wall ${opening.wallId}.`, opening.id); continue; }
      const overlap = (model.openings ?? []).find(other => other !== opening && other.wallId === opening.wallId && other.offsetMm < opening.offsetMm + opening.widthMm && opening.offsetMm < other.offsetMm + other.widthMm && model.openings.indexOf(other) < model.openings.indexOf(opening));
      if (overlap) add('error', 'opening.overlap', `Opening overlaps ${overlap.id} along their wall.`, opening.id);
      const length = wallLength(wall);
      if (![opening.offsetMm, opening.widthMm, opening.heightMm, opening.sillMm].every(isFiniteInteger) || opening.offsetMm < 0 || opening.widthMm < 1 || opening.heightMm < 1 || opening.sillMm < 0) add('error', 'opening.geometry', 'Opening offsets and dimensions must be valid non-negative integer millimeters.', opening.id);
      else if (opening.offsetMm + opening.widthMm > length + tolerance || opening.sillMm + opening.heightMm > wall.heightMm + tolerance) add('error', 'opening.fit', 'Opening falls outside its host wall.', opening.id);
    }
    for (const stair of model.stairs ?? []) {
      const from = levels.get(stair.fromLevelId); const to = levels.get(stair.toLevelId);
      if (!from || !to) add('error', 'stair.level', 'Stair references an unknown level.', stair.id);
      else if (stair.riserCount < 1 || stair.widthMm < 1 || stair.treadDepthMm < 1 || to.elevationMm <= from.elevationMm) add('error', 'stair.rise', 'Stair has an invalid rise, run, width, or riser count.', stair.id);
      else if (Math.hypot(stair.end.x - stair.start.x, stair.end.y - stair.start.y) + tolerance < (stair.riserCount - 1) * stair.treadDepthMm) add('error', 'stair.run', 'Stair run is too short for its authored tread count and depth.', stair.id);
      else add('warning', 'stair.code', `Concept riser is ${formatLength((to.elevationMm - from.elevationMm) / stair.riserCount)}; code verification remains open.`, stair.id);
    }
    const nodes = new Set((model.systems ?? []).flatMap(system => system.nodes.map(node => node.id)));
    for (const system of model.systems ?? []) {
      const local = new Map(system.nodes.map(node => [node.id, node]));
      const connected = new Set();
      for (const node of system.nodes) if (node.levelId && !levels.has(node.levelId)) add('error', 'reference.level', `Unknown level ${node.levelId}.`, node.id);
      for (const edge of system.edges) {
        const from = local.get(edge.from), to = local.get(edge.to);
        if (!from || !to) { add('error', 'system.edge', 'System edge references a node outside its system.', edge.id); continue; }
        connected.add(from.id); connected.add(to.id);
        if (!Array.isArray(edge.path) || edge.path.length < 2) { add('error', 'system.path', 'System edge requires at least two path points.', edge.id); continue; }
        if (!samePoint(edge.path[0], from.position, tolerance) || !samePoint(edge.path.at(-1), to.position, tolerance)) add('error', 'system.endpoint', 'System path endpoints must match their referenced node coordinates.', edge.id);
      }
      for (const node of system.nodes) if (!connected.has(node.id)) add('error', 'system.isolated-node', 'System node is not connected by any edge.', node.id);
      if (system.status !== 'concept') add('advisory', 'system.review', `${system.name} remains conceptual.`, system.id);
    }
    for (const object of [...(model.fixtures ?? []), ...(model.equipment ?? [])]) {
      for (const connection of object.connections ?? []) if (!nodes.has(connection)) add('error', 'system.connection', `Unknown system connection ${connection}.`, object.id);
    }
    for (const dimension of model.dimensions ?? []) if (!dimension.from || !dimension.to || samePoint(dimension.from, dimension.to)) add('error', 'dimension.geometry', 'Dimension endpoints must be distinct model points.', dimension.id);
    validateMaterials(model, add, levels, walls, tolerance);
    if (model.project?.jurisdiction?.codeReviewStatus !== 'researched') add('warning', 'code.status', 'Jurisdiction code review is incomplete or unavailable.', model.project?.id);
    return findings;
  }

  // Materials, assemblies, headers, members, foundations, and site surfaces. All optional.
  function validateMaterials(model, add, levels, walls, tolerance) {
    const materials = new Set(), unsourced = [];
    for (const material of model.materials ?? []) {
      materials.add(material.id);
      if (!Object.hasOwn(MATERIAL_CATEGORIES, material.category)) add('error', 'material.category', `Unknown material category ${material.category}.`, material.id);
      if (!material.evidence) unsourced.push(material.id);
    }
    // A catalog name can carry a precise grade (4000 psi, S355); without evidence nobody can tell where it came from.
    if (unsourced.length) add('advisory', 'material.evidence', `${unsourced.length} material${unsourced.length === 1 ? ' has' : 's have'} no evidence; record whether each came from the user, a source, or a generated assumption.`, unsourced[0]);
    const checkRef = (materialId, entityId) => { if (materialId != null && !materials.has(materialId)) add('error', 'reference.material', `Unknown material ${materialId}.`, entityId); };
    const positive = value => isFiniteInteger(value) && value > 0;
    const checkAssembly = (entity, depth, label) => {
      checkRef(entity.materialId, entity.id);
      if (!entity.layers) return;
      if (entity.materialId != null) add('error', 'material.conflict', `${label} sets both materialId and layers; use one.`, entity.id);
      if (!Array.isArray(entity.layers) || !entity.layers.length || entity.layers.some(layer => !positive(layer.thicknessMm))) { add('error', 'material.layers', `${label} layers need positive integer thicknesses.`, entity.id); return; }

      if (ids.some(id => typeof id !== 'string' || !/^[a-z][a-z0-9-]*$/.test(id)) || new Set(ids).size !== ids.length) add('error', 'material.layers', `${label} layers each need an id, unique within the ${label.toLowerCase()}.`, entity.id);
      for (const layer of entity.layers) checkRef(layer.materialId, entity.id);
      const total = entity.layers.reduce((sum, layer) => sum + layer.thicknessMm, 0);
      if (Math.abs(total - depth) > tolerance) add('error', 'material.layers', `${label} layers total ${total} mm but the ${label.toLowerCase()} is ${depth} mm thick.`, entity.id);
    };
    const checkShape = (shape, entityId) => {
      const fail = message => add('error', 'member.profile', message, entityId);
      if (!shape || !positive(shape.widthMm) || !positive(shape.depthMm)) return fail('Member shape needs positive integer width and depth.');
      if (shape.kind === 'wide-flange') {
        if (!positive(shape.flangeThicknessMm) || !positive(shape.webThicknessMm)) return fail('Wide-flange shapes need flangeThicknessMm and webThicknessMm.');
        if (2 * shape.flangeThicknessMm >= shape.depthMm || shape.webThicknessMm >= shape.widthMm) fail('Wide-flange flange or web thickness does not fit the shape.');
      } else if (shape.kind === 'hss') {
        if (!positive(shape.wallThicknessMm)) return fail('HSS shapes need wallThicknessMm.');
        if (2 * shape.wallThicknessMm >= Math.min(shape.widthMm, shape.depthMm)) fail('HSS wall thickness does not fit the shape.');
      } else if (shape.kind !== 'rectangular') fail(`Unknown member shape ${shape.kind}.`);

    }
    for (const slab of model.slabs) checkAssembly(slab, slab.thicknessMm, 'Slab');
    for (const stair of model.stairs) checkRef(stair.materialId, stair.id);
    if (model.site) checkRef(model.site.groundMaterialId, model.project.id);

    let structural = null;
    for (const opening of model.openings) {
      const wall = walls.get(opening.wallId);
      if (!wall || !opening.headers?.length) continue;
      structural ??= opening.id;
      const bands = wallBands(model, wall), length = wallLength(wall), byLayer = new Map();
      for (const header of opening.headers) {
        const fail = message => add('error', 'opening.header', message, opening.id);
        const kind = Object.hasOwn(HEADER_KINDS, header.kind) ? HEADER_KINDS[header.kind] : null;
        if (!kind) { fail(`Unknown header kind ${header.kind}.`); continue; }
        checkRef(header.materialId, opening.id);
        if (!positive(header.depthMm)) fail('Header depth must be a positive integer.');
        const band = headerBand(bands, header);
        if (!band) { fail(header.layerId == null ? 'A header in a layered wall must name its layerId.' : `Header layerId ${header.layerId} is not a layer of ${wall.id}.`); continue; }
        if (!byLayer.has(band.index)) byLayer.set(band.index, []);
        byLayer.get(band.index).push(header);
        if (header.face != null && (header.kind !== 'steel-angle' || !['inner', 'outer'].includes(header.face))) fail('Only steel angle lintels take a face, and it is inner or outer.');
        if (header.widthMm != null && (!positive(header.widthMm) || header.widthMm > band.layer.thicknessMm + tolerance)) fail('Header width must fit inside its wall layer.');
        if (header.kind === 'built-up-lumber' && !(Number.isInteger(header.plies) && header.plies >= 2)) fail('Built-up headers need plies (2 or more).');
        if (header.kind === 'steel-angle' && !(positive(header.legThicknessMm) && header.legThicknessMm < (header.depthMm ?? 0))) fail('Steel angle lintels need a legThicknessMm smaller than the depth.');

        if (!isFiniteInteger(bearing) || bearing < 0) fail('Header bearing must be a non-negative integer.');
        if (opening.sillMm + opening.heightMm + (header.depthMm ?? 0) > wall.heightMm + tolerance) add('error', 'opening.header-fit', 'Header rises above the top of its wall.', opening.id);

      for (const [index, headers] of byLayer) {

      }
    }
    for (const beam of model.beams ?? []) {
      structural ??= beam.id;
      if (!levels.has(beam.levelId)) add('error', 'reference.level', `Unknown level ${beam.levelId}.`, beam.id);
      checkRef(beam.materialId, beam.id);
      checkShape(beam.shape, beam.id);
      if (Math.hypot(beam.end.x - beam.start.x, beam.end.y - beam.start.y) < 1 || !isFiniteInteger(beam.topElevationMm)) add('error', 'member.geometry', 'Beam needs a non-zero length and an integer top elevation.', beam.id);
    }
    for (const column of model.columns ?? []) {
      structural ??= column.id;
      if (!levels.has(column.levelId)) add('error', 'reference.level', `Unknown level ${column.levelId}.`, column.id);
      checkRef(column.materialId, column.id);
      checkShape(column.shape, column.id);
      if (!isFiniteInteger(column.baseElevationMm) || !isFiniteInteger(column.topElevationMm) || column.topElevationMm <= column.baseElevationMm) add('error', 'member.geometry', 'Column top must be above its base.', column.id);
    }
    for (const foundation of model.foundations ?? []) {
      checkRef(foundation.materialId, foundation.id);
      const issues = curveIssues(foundation.boundary);
      if (issues.length) add('error', 'polygon.geometry', `Polygon has ${issues.join(', ')}.`, foundation.id);
      if (!positive(foundation.depthMm) || !isFiniteInteger(foundation.topElevationMm)) add('error', 'foundation.geometry', 'Foundation needs a positive integer depth and an integer top elevation.', foundation.id);
    }
    for (const surface of model.surfaces ?? []) {
      if (!levels.has(surface.levelId)) add('error', 'reference.level', `Unknown level ${surface.levelId}.`, surface.id);
      checkRef(surface.materialId, surface.id);
      const issues = curveIssues(surface.boundary);
      if (issues.length) add('error', 'polygon.geometry', `Polygon has ${issues.join(', ')}.`, surface.id);
      if (surface.followsGrade != null && typeof surface.followsGrade !== 'boolean') add('error', 'surface.geometry', 'followsGrade must be true or false.', surface.id);
      if (surface.followsGrade === true) {
        if (!positive(surface.thicknessMm) || (surface.gradeOffsetMm != null && !isFiniteInteger(surface.gradeOffsetMm))) add('error', 'surface.geometry', 'A surface that follows grade needs a positive integer thickness and an integer gradeOffsetMm.', surface.id);
      } else if (!positive(surface.thicknessMm) || !isFiniteInteger(surface.topElevationMm)) add('error', 'surface.geometry', 'Surface needs a positive integer thickness and an integer top elevation.', surface.id);
    }

    const siteCategory = materialId => MATERIAL_CATEGORIES[(model.materials ?? []).find(item => item.id === materialId)?.category]?.site;
    const misused = [...model.walls.flatMap(wall => [wall.materialId, ...(wall.layers ?? []).map(layer => layer.materialId)].map(id => [id, wall.id])),
      ...model.openings.flatMap(opening => (opening.headers ?? []).map(header => [header.materialId, opening.id])),
      ...[...(model.beams ?? []), ...(model.columns ?? [])].map(member => [member.materialId, member.id])].find(([id]) => id && siteCategory(id));
    if (misused) add('advisory', 'material.category-use', `A landscape material (${misused[0]}) is used in a building assembly or member.`, misused[1]);
    validateSite(model, add);
    if (structural) add('advisory', 'structure.review', 'Headers, beams, and columns are concept placeholders; member sizes, bearing, and connections need a structural engineer.', structural);
  }

  const PLANT_KINDS = {
    'deciduous-tree': { label: 'Deciduous tree', tree: true },
    'evergreen-tree': { label: 'Evergreen tree', tree: true },
    shrub: { label: 'Shrub' },
    groundcover: { label: 'Groundcover' },
    perennial: { label: 'Perennial' },
    'ornamental-grass': { label: 'Ornamental grass' }
  };
  const PLANTING_STATUS = { existing: 'Existing to remain', proposed: 'Proposed', remove: 'Existing to remove' };
  // Property line, setbacks, grading, contours, spot elevations, plants, and plantings. All optional.
  function validateSite(model, add) {
    const site = model.site ?? {}, positive = value => isFiniteInteger(value) && value > 0;
    const evidenceOf = (entity, label) => { if (!entity.evidence) add('error', 'site.evidence', `${label} needs an evidence record.`, entity.id); };
    const idOf = (entity, label) => { if (typeof entity?.id !== 'string') add('error', 'entity.id', `${label} is missing its stable ID.`); };
    for (const [key, label] of [['propertyLine', 'Property line'], ['gradingLimit', 'Grading limit']]) {
      const entity = site[key]; if (!entity) continue;
      idOf(entity, label); evidenceOf(entity, label);
      const issues = curveIssues(entity.boundary, { bezier: false });
      if (issues.length) add('error', 'polygon.geometry', `${label} has ${issues.join(', ')}.`, entity.id);
    }
    // Legal lines come from a survey or a recorded plat, never from imagery or a guess.
    const line = site.propertyLine;
    if (line?.evidence && (line.evidence.status !== 'accepted' || !['user', 'attachment', 'code-source'].includes(line.evidence.source))) add('advisory', 'site.survey', 'The property line is not from an accepted survey or plat; lot lines and setbacks need a boundary survey.', line.id);
    const edges = line?.boundary?.length ?? 0;
    for (const setback of site.setbacks ?? []) {
      idOf(setback, 'Setback'); evidenceOf(setback, 'Setback');
      if (!line) add('error', 'site.setback', 'Setbacks need a property line.', setback.id);
      else if (!Number.isInteger(setback.edgeIndex) || setback.edgeIndex < 0 || setback.edgeIndex >= edges) add('error', 'site.setback', `Setback edgeIndex must name a property line edge, 0 to ${edges - 1}.`, setback.id);
      if (!positive(setback.distanceMm)) add('error', 'site.setback', 'Setback distance must be a positive integer.', setback.id);
    }
    const interval = site.contourIntervalMm, tolerance = model.project.coordinates.toleranceMm ?? 3;
    // Imperial intervals (1' = 304.8 mm) are not whole millimetres, so the interval may be any positive number.
    const intervalOk = typeof interval === 'number' && Number.isFinite(interval) && interval > 0;
    if (interval != null && !intervalOk) add('error', 'site.contour', 'contourIntervalMm must be a positive number.', model.project.id);
    for (const contour of site.contours ?? []) {
      idOf(contour, 'Contour'); evidenceOf(contour, 'Contour');
      const issues = pathIssues(contour.path, Boolean(contour.closed));
      if (issues.length) add('error', 'site.contour', `Contour has ${issues.join(', ')}.`, contour.id);
      if (!isFiniteInteger(contour.elevationMm)) add('error', 'site.contour', 'Contour elevation must be an integer.', contour.id);
      else if (intervalOk && Math.abs(contour.elevationMm - Math.round(contour.elevationMm / interval) * interval) > tolerance) add('error', 'site.contour', `Contour elevation ${contour.elevationMm} is not on the ${interval} mm interval.`, contour.id);
      if (!['existing', 'proposed'].includes(contour.status)) add('error', 'site.contour', 'Contour status must be existing or proposed.', contour.id);
    }
    for (const spot of site.spotElevations ?? []) {
      idOf(spot, 'Spot elevation'); evidenceOf(spot, 'Spot elevation');
      if (!isModelPoint(spot.position) || !isFiniteInteger(spot.elevationMm) || !['existing', 'proposed'].includes(spot.status)) add('error', 'site.spot', 'Spot elevations need an integer position, an integer elevation, and an existing or proposed status.', spot.id);
    }
    // Proposed grading happens inside the limit of grading; outside it the existing ground stays.
    const proposed = [...(site.contours ?? []).filter(item => item.status === 'proposed'), ...(site.spotElevations ?? []).filter(item => item.status === 'proposed')];
    if (proposed.length && !site.gradingLimit) add('error', 'site.grading-limit', 'Proposed contours and spot elevations need a gradingLimit.', proposed[0].id);
    else if (proposed.length && !curveIssues(site.gradingLimit.boundary, { bezier: false }).length) {
      const limit = ringOf(site.gradingLimit.boundary);
      const onLimit = p => limit.some((a, i) => { const b = limit[(i + 1) % limit.length], d = sub(b, a), t = Math.max(0, Math.min(1, dot2(sub(p, a), d) / (dot2(d, d) || 1))); return Math.hypot(p.x - a.x - d.x * t, p.y - a.y - d.y * t) <= tolerance + CURVE_TOLERANCE_MM; });
      for (const item of proposed) {
        const points = item.path && !pathIssues(item.path, Boolean(item.closed)).length ? curvePoints(item.path, Boolean(item.closed)) : item.position ? [item.position] : [];
        if (points.some(p => !pointInPolygon(p, limit) && !onLimit(p))) add('error', 'site.grading-limit', `${item.id} runs outside the grading limit.`, item.id);
        // An open proposed contour ties back into existing grade where it meets the limit.
        else if (item.path && !item.closed) {
          const terrain = terrainOf(model);
          for (const end of [points[0], points.at(-1)]) if (terrain?.existing && Math.abs(terrain.existing.at(end) - item.elevationMm) > Math.max(tolerance, 50)) add('error', 'site.grading-limit', `${item.id} ends at ${Math.round(terrain.existing.at(end))} mm existing grade but is drawn at ${item.elevationMm} mm; close it or end it where existing grade matches.`, item.id);
        }
      }
    }
    for (const issue of terrainOf(model)?.issues ?? []) add(issue.code === 'terrain.constraint-failed' ? 'warning' : 'error', issue.code, issue.message, issue.entityId ?? model.project.id);
    const plants = new Map();
    for (const plant of model.plants ?? []) {

      placer?.reserve({ x0: mid.x - tw / 2, y0: mid.y - 1 - T.note, x1: mid.x + tw / 2, y1: mid.y });

    return parts.join('');
  }

  // Level datum: centre line across the drawing with a quartered symbol and labels at the right.
  function datum(x0, x1, y, name, valueMm, profile) {
    const P = profile.pens, T = profile.text, c = { x: x1 + 3, y }, r = 2;
    const wedge = (a0, a1) => `<path d="M${num(c.x)},${num(c.y)} L${num(c.x + r * Math.cos(a0))},${num(c.y + r * Math.sin(a0))} A${r},${r} 0 0 1 ${num(c.x + r * Math.cos(a1))},${num(c.y + r * Math.sin(a1))} Z" fill="${DRAFT.ink}" stroke="none"/>`;
    return `<g data-role="datum">${svgLine({ x: x0, y }, { x: x1, y }, { width: P.fine, dash: '8 1.5 1.5 1.5' })}${svgCircle(c, r, { width: P.fine, fill: DRAFT.paper })}${wedge(-Math.PI / 2, 0)}${wedge(Math.PI / 2, Math.PI)}${svgText(c.x + r + 1.5, y - 0.8, name, T.note, { anchor: 'start', weight: 700 })}${svgText(c.x + r + 1.5, y + T.note + 0.4, profile.datum(valueMm), T.note, { anchor: 'start', upper: false })}</g>`;
  }

  function levelBand(model, levelId) {
    const ordered = [...model.levels].sort((a, b) => a.elevationMm - b.elevationMm);
    const index = ordered.findIndex(level => level.id === levelId), level = ordered[index];
    return { min: level.elevationMm, max: ordered[index + 1]?.elevationMm ?? level.elevationMm + (level.floorToFloorMm ?? 3000) };
  }
  function clipSegmentToBand(a, b, band) {
    const dz = b.z - a.z;
    if (Math.abs(dz) < 1e-9) return a.z >= band.min && a.z < band.max ? [a, b] : null;
    const at = t => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, z: a.z + dz * t });
    const t0 = Math.max(0, Math.min((band.min - a.z) / dz, (band.max - a.z) / dz));
    const t1 = Math.min(1, Math.max((band.min - a.z) / dz, (band.max - a.z) / dz));

  const sortedLevels = model => [...model.levels].sort((a, b) => a.elevationMm - b.elevationMm);
  const sectionLetter = (model, sectionId) => String.fromCharCode(65 + Math.max(0, (model.sections ?? []).findIndex(item => item.id === sectionId)));
  const sectionSheetId = (model, sectionId) => `A-3${String((model.sections ?? []).findIndex(item => item.id === sectionId) + 1).padStart(2, '0')}`;
  function rotatedRect(center, sizeX, sizeY, degrees) {
    const a = (degrees ?? 0) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    return [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([i, j]) => ({ x: center.x + i * sizeX / 2 * c - j * sizeY / 2 * s, y: center.y + i * sizeX / 2 * s + j * sizeY / 2 * c }));

  function stairCorners(stair) {
    const u = unit2(sub(stair.end, stair.start)), n = perp(u), w = stair.widthMm / 2;

  }
  function planExtent(model) {
    const points = [
      ...model.spaces.flatMap(space => ringOf(space.boundary)),
      ...model.walls.flatMap(wallPoints),
      ...model.stairs.flatMap(stairCorners),
      ...[...model.fixtures, ...model.equipment].flatMap(object => rotatedRect(object.position, object.size.x, object.size.y, object.rotationDeg)),
      ...(model.sections ?? []).flatMap(section => [section.start, section.end]),
      ...(model.surfaces ?? []).flatMap(surface => ringOf(surface.boundary)),
      ...(model.beams ?? []).flatMap(beamCorners),

  }
  // Floor plans of a model with site content frame on the building plus a margin; the site plan shows
  // the rest. Section lines and site surfaces are cropped at this frame.
  const BUILDING_FRAME_MARGIN_MM = 2000;
  function buildingFrame(model) {
    const ext = planExtent({ ...model, sections: [], surfaces: [] }), m = BUILDING_FRAME_MARGIN_MM;
    return { minX: ext.minX - m, minY: ext.minY - m, maxX: ext.maxX + m, maxY: ext.maxY + m };
  }
  // Liang-Barsky clip of a segment to an axis-aligned box, or null when it misses.
  function clipSegmentToBox(a, b, box) {
    let t0 = 0, t1 = 1;
    const d = sub(b, a);
    for (const [p, q] of [[-d.x, a.x - box.minX], [d.x, box.maxX - a.x], [-d.y, a.y - box.minY], [d.y, box.maxY - a.y]]) {
      if (Math.abs(p) < 1e-12) { if (q < 0) return null; continue; }
      const r = q / p;
      if (p < 0) t0 = Math.max(t0, r); else t1 = Math.min(t1, r);

  // A wall end is joined when it lands on another wall of the same level; joined ends extend

  function wallEndJoined(wall, point, walls, tolerance) {
    return walls.some(other => {
      if (other.id === wall.id) return false;
      if (other.bulge) return wallDistance(other, point) <= other.thicknessMm / 2 + tolerance;
      const d = sub(other.end, other.start), len2 = dot2(d, d) || 1;
      const t = Math.max(0, Math.min(1, dot2(sub(point, other.start), d) / len2));
      return Math.hypot(...Object.values(sub(point, add(other.start, mul(d, t))))) <= other.thicknessMm / 2 + tolerance;

  // ---------------------------------------------------------------------------
  // Materials. Spec: references/drafting-standard.md "Materials".
  // Hatches are authored in paper millimetres at the `fine` pen, so they read the same at every
  // scale. `metric` overrides the shared style where the metric profile convention differs; sources
  // and confidence for each convention are in drafting-standard.md, "Material sources".
  // ---------------------------------------------------------------------------
  const MATERIAL_CATEGORIES = {
    earth: { label: 'Earth', color: '#8b7355', style: { kind: 'pattern', patterns: ['earth'] } },
    gravel: { label: 'Gravel', color: '#a49d90', style: { kind: 'pattern', patterns: ['gravel'] } },
    sand: { label: 'Sand', color: '#d9c9a0', style: { kind: 'pattern', patterns: ['sand'] } },
    concrete: { label: 'Concrete', color: '#bcbab4', style: { kind: 'pattern', patterns: ['concrete'] } },
    'reinforced-concrete': { label: 'Reinforced concrete', color: '#adafac', style: { kind: 'pattern', patterns: ['concrete'] }, metric: { kind: 'pattern', patterns: ['concrete', 'diagonal-wide'] } },
    'concrete-masonry': { label: 'Concrete masonry', color: '#b3b1aa', style: { kind: 'pattern', patterns: ['diagonal-wide', 'concrete-sparse'] } },
    brick: { label: 'Brick', color: '#a5563f', style: { kind: 'pattern', patterns: ['diagonal'] } },
    steel: { label: 'Steel', color: '#59636c', style: { kind: 'solid' } },
    'wood-framing': { label: 'Sawn lumber', color: '#c8a26a', style: { kind: 'grain' } },
    'engineered-wood': { label: 'Engineered wood', color: '#d3ae78', style: { kind: 'laminated' } },
    'insulation-batt': { label: 'Batt insulation', color: '#e9d58c', style: { kind: 'batt' } },
    'insulation-rigid': { label: 'Rigid insulation', color: '#dfe5bf', style: { kind: 'zigzag' }, metric: { kind: 'pattern', patterns: ['crosshatch'] } },
    gypsum: { label: 'Gypsum board', color: '#eceae4', style: { kind: 'pattern', patterns: ['stipple'] } },
    // Site and landscape surfaces (drafting-standard.md "Site and landscape"). `site` marks categories
    // that describe ground cover, not building assemblies.
    lawn: { label: 'Lawn', color: '#8fb36a', site: true, style: { kind: 'pattern', patterns: ['lawn'] } },
    mulch: { label: 'Mulch planting bed', color: '#7d5b3e', site: true, style: { kind: 'pattern', patterns: ['mulch'] } },
    asphalt: { label: 'Asphalt paving', color: '#55585a', site: true, style: { kind: 'pattern', patterns: ['asphalt'] } },
    'unit-pavers': { label: 'Unit pavers', color: '#b98b6e', site: true, style: { kind: 'pattern', patterns: ['pavers'] } },
    flagstone: { label: 'Flagstone', color: '#a8a291', site: true, style: { kind: 'pattern', patterns: ['flagstone'] } },
    water: { label: 'Water', color: '#7fa7c4', site: true, style: { kind: 'pattern', patterns: ['water'] } },
    decking: { label: 'Wood decking', color: '#b88b5a', site: true, style: { kind: 'pattern', patterns: ['boards'] } },
    generic: { label: 'Material not specified', color: '#d6d0c3', style: { kind: 'poche' } }

  // Header kinds fix the drawn shape only. A header's material comes from its materialId; without one it
  // is unspecified and draws in poché, like any other element.
  const HEADER_KINDS = {
    'sawn-lumber': { label: 'Sawn lumber header' },
    'built-up-lumber': { label: 'Built-up lumber header' },
    'engineered-lumber': { label: 'Engineered lumber header' },
    'steel-angle': { label: 'Steel angle lintel' },
    'steel-beam': { label: 'Steel beam header' },
    'concrete-lintel': { label: 'Concrete lintel' },
    'masonry-bond-beam': { label: 'Masonry bond beam' }
  };
  const SHAPE_LABELS = { rectangular: 'Rectangular', 'wide-flange': 'Wide-flange', hss: 'Hollow structural section' };
  const materialStyle = (category, profile) => {
    const entry = MATERIAL_CATEGORIES[category] ?? MATERIAL_CATEGORIES.generic;
    return (profile.id === 'metric' && entry.metric) || entry.style;
  };
  // Studio plotting policy, not a standard: material detail is drawn at the profile's 1:100-class scale
  // (1/8" = 1'-0" imperial, 1:100 metric) and larger. Smaller scales keep solid poché.
  const materialsActive = (model, ratio) => (model.materials ?? []).length > 0 && ratio <= profileFor(model).materialDetailRatio;
  // Thickest layer; used only to colour 3D massing.
  const coreLayerIndex = layers => layers.reduce((best, layer, index) => layer.thicknessMm > layers[best].thicknessMm ? index : best, 0);
  // Layers of a wall or slab in authored order; a single material or none becomes one full-depth layer.
  const assemblyLayers = (entity, depth) => entity.layers?.length ? entity.layers : [{ id: null, materialId: entity.materialId ?? null, thicknessMm: depth }];
  // +1 when a wall's interior (the side toward the centre of its level's walls) is its left side.
  function wallInteriorSign(model, wall) {
    const walls = model.walls.filter(item => item.levelId === wall.levelId), box = boundsOf(walls.flatMap(wallPoints));
    const n = perp(unit2(sub(wall.end, wall.start))), mid = mul(add(wall.start, wall.end), 0.5);

  }
  // Wall layers as bands across the thickness: s is the offset from the centreline, positive to the
  // left looking from start to end. `layerOrder: "interior-to-exterior"` starts at the interior face, so
  // reversing the wall's direction does not flip its assembly.
  function wallBands(model, wall) {
    const t = wall.thicknessMm, dir = wall.layerOrder === 'interior-to-exterior' ? wallInteriorSign(model, wall) : 1;
    let face = dir * t / 2;
    return assemblyLayers(wall, t).map((layer, index) => {
      const band = { layer, index, s0: face, s1: face - dir * layer.thicknessMm };
      face = band.s1;

  const headerBand = (bands, header) => header.layerId == null ? (bands.length === 1 && bands[0].layer.id == null ? bands[0] : null) : bands.find(band => band.layer.id === header.layerId) ?? null;

  function hatchPattern(id, profile) {
    const pen = profile.pens.fine, ink = DRAFT.ink;
    const line = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ink}" stroke-width="${pen}"/>`;
    const dots = (r, list) => list.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${ink}"/>`).join('');
    const rings = list => list.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${ink}" stroke-width="${pen}"/>`).join('');

      crosshatch: { w: 1.2, h: 1.2, rotate: -45, body: line(0, 0.6, 1.2, 0.6) + line(0.6, 0, 0.6, 1.2) },
      earth: { w: 5, h: 5, rotate: -45, body: [0.7, 1.2, 1.7].map(y => line(0.5, y, 2.1, y)).join('') + [3, 3.5, 4].map(x => line(x, 2.9, x, 4.5)).join('') },
      gravel: { w: 6, h: 6, body: rings([[1, 1.2, 0.55], [3.4, 0.9, 0.4], [5, 2.4, 0.6], [2.2, 3.2, 0.45], [4, 4.6, 0.5], [0.9, 4.9, 0.38], [5.4, 5.5, 0.3]]) },
      sand: { w: 2.5, h: 2.5, body: dots(0.1, [[0.4, 0.5], [1.6, 0.3], [1.1, 1.2], [2.1, 1.5], [0.5, 2], [1.5, 2.2]]) },
      stipple: { w: 2, h: 2, body: dots(0.08, [[0.5, 0.5], [1.5, 1], [0.8, 1.6]]) },
      concrete: { w: 6, h: 6, body: dots(0.13, [[0.7, 0.8], [2.6, 0.5], [4.6, 1.2], [1.5, 2.4], [3.6, 2.9], [5.3, 3.6], [0.6, 4.2], [2.5, 5.1], [4.4, 5.3]]) + tri(3, 2, 0.8) + tri(1, 3.6, 0.7) + tri(4.8, 5.6, 0.7) },
      'concrete-sparse': { w: 6, h: 6, body: dots(0.12, [[1.2, 1.4], [4.2, 2.2], [2.4, 4.4], [5.1, 5]]) + tri(0.8, 5.6, 0.6) },
      // Landscape tiles. Grass tufts, bark, aggregate, coursed units, crazy paving, ripples, boards.
      lawn: { w: 5, h: 5, body: [[1, 2], [3.5, 4.5]].map(([x, y]) => line(x - 0.5, y, x - 0.75, y - 0.9) + line(x, y, x, y - 1.05) + line(x + 0.5, y, x + 0.75, y - 0.9)).join('') },
      mulch: { w: 4, h: 4, body: line(0.4, 0.8, 1.2, 1.1) + line(2.4, 0.4, 2.8, 1.1) + line(1.4, 2.4, 2.2, 2.2) + line(3.1, 2.9, 3.6, 3.6) + line(0.5, 3.2, 0.8, 3.8) + dots(0.12, [[3.4, 1.6], [1.1, 1.8], [2.4, 3.5]]) },
      asphalt: { w: 1.8, h: 1.8, body: dots(0.13, [[0.3, 0.4], [1.2, 0.2], [0.8, 0.9], [1.5, 1.3], [0.4, 1.5]]) },
      pavers: { w: 4, h: 4, body: line(0, 0.01, 4, 0.01) + line(0, 2, 4, 2) + line(0.01, 0, 0.01, 2) + line(2, 2, 2, 4) },
      flagstone: { w: 8, h: 8, body: [[0, 1.5, 3.2, 0.6], [3.2, 0.6, 5.4, 2.2], [5.4, 2.2, 8, 1.5], [3.2, 0.6, 3.6, 0], [3.2, 0.6, 2.6, 3.8], [5.4, 2.2, 5.9, 5], [2.6, 3.8, 5.9, 5], [2.6, 3.8, 0, 4.4], [5.9, 5, 8, 4.4], [0, 4.4, 1.6, 8], [5.9, 5, 4.6, 8]].map(([x1, y1, x2, y2]) => line(x1, y1, x2, y2)).join('') },
      water: { w: 6, h: 3, body: `<path d="M0.4,1.5 Q1.15,0.9 1.9,1.5 T3.4,1.5" fill="none" stroke="${ink}" stroke-width="${pen}"/>` },

  }

  // Collects the materials and hatch patterns a sheet uses, for its <defs> and its material key.
  function materialContext(model, profile, active) {
    const catalog = new Map((model.materials ?? []).map(material => [material.id, material]));
    const patterns = new Set(), used = new Map();
    const ctx = {
      active, profile,
      // Resolves a material reference (or a bare category) and records it for the key.
      resolve(materialId, fallbackCategory = 'generic') {
        const material = materialId ? catalog.get(materialId) : null;
        const category = material?.category ?? fallbackCategory;
        const key = material ? material.id : `category:${category}`;
        if (active && !used.has(key)) used.set(key, { name: material?.name ?? MATERIAL_CATEGORIES[category]?.label ?? category, category });
        return category;
      },
      // Fills a paper region. `frame` is { o, u, v, L, T }: origin, unit vectors along and across, and
      // lengths along and across in paper mm. It orients the directional symbols (batt, grain, zig-zag).
      region(points, frame, category, clipId = null) {
        const style = materialStyle(category, profile), P = profile.pens;
        if (style.kind === 'poche') return svgPoly(points, { fill: DRAFT.poche, width: 0, inert: true });
        if (style.kind === 'solid') return svgPoly(points, { fill: DRAFT.ink, width: 0, inert: true });
        const parts = [svgPoly(points, { fill: DRAFT.paper, width: 0, inert: true })];
        if (!frame || frame.T < DRAFT.hatchMinMm || frame.L < DRAFT.hatchMinMm) return parts.join('');
        if (style.kind === 'pattern') {
          for (const id of style.patterns) { patterns.add(id); parts.push(svgPoly(points, { fill: `url(#hatch-${id})`, width: 0, inert: true })); }
          return parts.join('');
        }
        // A curved band supplies its own mapping, so directional symbols follow the arc.
        const at = frame.at ?? ((x, y) => add(add(frame.o, mul(frame.u, x)), mul(frame.v, y)));
        const { L, T } = frame, pen = { stroke: DRAFT.ink, width: P.fine };
        if (style.kind === 'batt') {
          const count = Math.max(1, Math.round(L / Math.max(T * 0.5, 0.6))), w = L / count;
          let d = `M${pts([at(0, T * 0.12)])}`;
          for (let i = 0; i < count; i += 1) {
            const y0 = i % 2 ? T * 0.88 : T * 0.12, y1 = i % 2 ? T * 0.12 : T * 0.88, x = i * w;
            d += ` C${pts([at(x + w / 2, y0)])} ${pts([at(x + w / 2, y1)])} ${pts([at(x + w, y1)])}`;
          }
          parts.push(`<path d="${d}" fill="none" pointer-events="none" ${strokeAttrs(pen)}/>`);
        } else if (style.kind === 'zigzag') {
          const step = Math.max(T / 2, 0.5), count = Math.floor(L / step);
          for (const phase of [0, 1]) {
            const yAt = i => (i + phase) % 2 ? T : 0, vertices = [];
            for (let i = 0; i <= count; i += 1) vertices.push(at(i * step, yAt(i)));
            const rest = (L - count * step) / step;
            if (rest > 1e-6) vertices.push(at(L, yAt(count) + (yAt(count + 1) - yAt(count)) * rest));
            parts.push(svgPoly(vertices, { open: true, inert: true, ...pen }));
          }
        } else if (style.kind === 'grain') {
          const wave = Math.max(4, T * 2.5), amp = Math.min(0.25, T * 0.08);
          for (const [base, phase] of [[0.3, 0], [0.7, 1.7]]) {
            const vertices = [];
            for (let x = 0; x <= L + 1e-6; x += wave / 8) vertices.push(at(Math.min(x, L), T * base + amp * Math.sin(2 * Math.PI * x / wave + phase)));
            parts.push(svgPoly(vertices, { open: true, inert: true, ...pen }));
          }
        } else if (style.kind === 'laminated') {
          const count = Math.max(2, Math.round(T / 0.8));
          for (let i = 1; i < count; i += 1) parts.push(frame.at ? svgPoly(Array.from({ length: 17 }, (_, k) => at(L * k / 16, T * i / count)), { open: true, inert: true, ...pen }) : svgLine(at(0, T * i / count), at(L, T * i / count), pen));
        }
        // Directional symbols follow the frame, so a non-rectangular region clips them to its outline.
        if (clipId) return `${parts[0]}<clipPath id="${escapeHtml(clipId)}">${svgPoly(points, { width: 0 })}</clipPath><g clip-path="url(#${escapeHtml(clipId)})" pointer-events="none">${parts.slice(1).join('')}</g>`;
        return parts.join('');
      },
      // End-grain symbol for a sawn member cut across its length: an X (imperial) or growth rings (metric).
      woodEnd(frame) {
        const at = (x, y) => add(add(frame.o, mul(frame.u, x)), mul(frame.v, y)), pen = { stroke: DRAFT.ink, width: profile.pens.fine };
        if (profile.id !== 'metric') return svgLine(at(0, 0), at(frame.L, frame.T), pen) + svgLine(at(0, frame.T), at(frame.L, 0), pen);
        return [0.36, 0.18].map(k => svgPoly(Array.from({ length: 24 }, (_, i) => at(frame.L / 2 + Math.cos(i * Math.PI / 12) * frame.L * k, frame.T / 2 + Math.sin(i * Math.PI / 12) * frame.T * k)), { inert: true, ...pen })).join('');
      },
      // Fills a structural member cut across its length. `outline` and `hole` are paper polygons.
      member(outline, hole, frame, category) {
        const style = materialStyle(category, profile);
        if (style.kind === 'solid') {
          const path = [outline, hole].filter(Boolean).map(ring => `M${pts(ring)}Z`).join(' ');
          return `<path d="${path}" fill="${DRAFT.ink}" fill-rule="evenodd" pointer-events="none" stroke="none"/>`;
        }
        if (style.kind === 'grain') return svgPoly(outline, { fill: DRAFT.paper, width: 0, inert: true }) + ctx.woodEnd(frame);

      defs() {

      const [h0, h1] = hRange(corners);
      beyond.push({ id: column.id, kind: 'member', h0, h1, z0: column.baseElevationMm, z1: column.topElevationMm, flange: 0, depth: crossing ? 0 : Math.max(0, Math.min(...ss)) });

      const corners = stairCorners(stair), crossing = clipSegmentToConvex(section.start, section.end, corners);
      const parallel = Math.abs(dot2(u, d)) >= 0.3;
      let profile;
      if (parallel) {

  function renderSectionSheet(model, sectionId) {
    const section = (model.sections ?? []).find(item => item.id === sectionId) ?? model.sections?.[0];
    if (!section) return null;
    const geometry = sectionGeometry(model, section), roof = model.roofs[0];
    const ground = model.project.coordinates.siteDatumMm ?? 0;
    const hs = [], zs = [ground];
    for (const item of [...geometry.cut, ...geometry.beyond, ...geometry.members]) {
      if (item.profile) { hs.push(...item.profile.map(p => p.h)); zs.push(...item.profile.map(p => p.z)); }
      else if (item.hull) { hs.push(...item.hull.map(p => p.x)); zs.push(...item.hull.map(p => p.y)); }
      else if (item.shape) { hs.push(item.hc - item.shape.widthMm / 2, item.hc + item.shape.widthMm / 2); zs.push(item.z0, item.z0 + item.shape.depthMm); }
      else { hs.push(item.h0, item.h1); zs.push(item.z0, item.z1); }
    }
    for (const piece of geometry.roofCut) { hs.push(...piece.points.map(p => p.h)); zs.push(...piece.points.map(p => p.z)); }
    // With terrain the drawing spans the whole cut line, so the ground reads across the site.
    const groundProfile = geometry.ground;
    if (groundProfile) { hs.push(...groundProfile.map(p => p.h)); zs.push(...groundProfile.map(p => p.z), ...groundProfile.map(p => p.existing)); }

    const minH = Math.min(...hs), maxH = Math.max(...hs);
    // Plants within the drawing's width are drawn beyond the cut, at full height.

      extent: { minH, maxH, minZ: Math.min(...zs), maxZ: Math.max(...zs) },

          }
        }
        const cutShapes = geometry.cut.map(item => ({ id: item.id, points: item.profile ? item.profile.map(p => map(p.h, p.z)) : rect(item) }));

          const owners = new Set(geometry.regions.map(region => region.id)), fills = [], lines = [];

            if (owners.has(item.id)) continue;

            const across = Math.sign(region.hOther - region.hFace) || 1;

              const angle = [at(0, z0), at(width, z0), at(width, z0 + lt), at(lt, z0 + lt), at(lt, z0 + depth), at(0, z0 + depth)];
              fills.push(mats.member(angle, null, frame, category), svgPoly(angle, { width: P.fine, inert: true }));
            } else if (header.kind === 'steel-beam') {

              fills.push(svgPoly(box, { fill: DRAFT.paper, width: 0, inert: true }), mats.member(shape.outline, null, shape.frame, category), svgPoly(shape.outline, { width: P.fine, inert: true }));

  }

  // ---------------------------------------------------------------------------
  // Site plan, L-101. Spec: references/drafting-standard.md "Site and landscape".
  // ---------------------------------------------------------------------------
  // Engineer's scales (imperial) and the ISO 5455 site range (metric). Building sheets keep their ladders.
  const SITE_SCALES = {
    imperial: [[120, '1" = 10\''], [240, '1" = 20\''], [360, '1" = 30\''], [480, '1" = 40\''], [600, '1" = 50\''], [720, '1" = 60\''], [1200, '1" = 100\'']],
    metric: [[100, '1:100'], [200, '1:200'], [250, '1:250'], [500, '1:500'], [1000, '1:1000']]

  const SITE_SCHEDULE_WIDTH = 88;
  // Survey-style lengths: decimal feet imperial, metres metric.
  const siteLength = (mm, profile) => profile.id === 'metric' ? `${(mm / 1000).toFixed(2)} m` : `${(mm / 304.8).toFixed(2)}'`;
  const contourLabel = (mm, profile) => profile.id === 'metric' ? String(+(mm / 1000).toFixed(2)) : String(+(mm / 304.8).toFixed(1));
  // Site elevations: decimal feet imperial (civil practice), signed metres metric.
  const siteDatum = (mm, profile) => profile.id === 'metric' ? profile.datum(mm) : `${(mm / 304.8).toFixed(2)}'`;
  // Quadrant bearing of a direction, measured from true north (trueNorthDeg clockwise from project north).
  function bearingLabel(d, northDeg) {
    const az = ((Math.atan2(d.x, d.y) * 180 / Math.PI - northDeg) % 360 + 360) % 360;
    const [ns, ew, angle] = az <= 90 ? ['N', 'E', az] : az <= 180 ? ['S', 'E', 180 - az] : az <= 270 ? ['S', 'W', az - 180] : ['N', 'W', 360 - az];
    let seconds = Math.round(angle * 3600);
    const degrees = Math.floor(seconds / 3600); seconds -= degrees * 3600;
    const minutes = Math.floor(seconds / 60); seconds -= minutes * 60;
    return `${ns} ${degrees}°${String(minutes).padStart(2, '0')}'${String(seconds).padStart(2, '0')}" ${ew}`;
  }
  const plantOf = (model, planting) => (model.plants ?? []).find(plant => plant.id === planting.plantId);
  const plantingCanopy = (model, planting) => planting.canopyDiameterMm ?? plantOf(model, planting)?.matureSpreadMm ?? 1000;
  // One plant per position; a massed area at triangular spacing.
  function plantingQuantity(model, planting) {
    if (planting.position) return 1;
    const spacing = plantOf(model, planting)?.spacingMm;
    return spacing ? Math.ceil(polygonArea(ringOf(planting.boundary)) / (spacing * spacing * Math.sqrt(3) / 2)) : 0;
  }
  // Schedule rows: one per plant and status, ordered by kind, key, then status.
  function plantSchedule(model) {
    const rows = new Map(), kinds = Object.keys(PLANT_KINDS), statuses = Object.keys(PLANTING_STATUS);
    for (const planting of model.plantings ?? []) {
      const plant = plantOf(model, planting); if (!plant) continue;
      const key = `${plant.id}|${planting.status}`;
      if (!rows.has(key)) rows.set(key, { plant, status: planting.status, quantity: 0, plantingIds: [] });
      const row = rows.get(key); row.quantity += plantingQuantity(model, planting); row.plantingIds.push(planting.id);
    }
    return [...rows.values()].sort((a, b) => kinds.indexOf(a.plant.kind) - kinds.indexOf(b.plant.kind) || a.plant.key.localeCompare(b.plant.key) || statuses.indexOf(a.status) - statuses.indexOf(b.status));
  }
  function siteExtent(model) {
    const site = model.site ?? {}, points = [];
    for (const entity of [site.propertyLine, site.gradingLimit]) if (entity) points.push(...ringOf(entity.boundary));
    for (const contour of site.contours ?? []) points.push(...curvePoints(contour.path, Boolean(contour.closed)));
    for (const spot of site.spotElevations ?? []) points.push(spot.position);
    for (const planting of model.plantings ?? []) {
      if (planting.boundary) { points.push(...ringOf(planting.boundary)); continue; }
      const r = plantingCanopy(model, planting) / 2;
      points.push({ x: planting.position.x - r, y: planting.position.y - r }, { x: planting.position.x + r, y: planting.position.y + r });
    }
    const building = planExtent(model);
    points.push({ x: building.minX, y: building.minY }, { x: building.maxX, y: building.maxY });
    const box = boundsOf(points);
    return { minX: box.x0, minY: box.y0, maxX: box.x1, maxY: box.y1 };
  }
  // Plan symbol of a planting, in paper mm. Proposed plants draw solid; existing plants to remain draw
  // dashed with an open trunk; plants to remove draw dashed and crossed out.
  function plantSymbol(c, r, plant, status, P, trunkR = 0) {
    const kind = Object.hasOwn(PLANT_KINDS, plant.kind) ? plant.kind : 'shrub', tree = PLANT_KINDS[kind].tree;

  const ENTITY_GROUPS = [['levels', 'Level'], ['spaces', 'Room'], ['walls', 'Wall'], ['openings', 'Opening'], ['slabs', 'Slab'], ['roofs', 'Roof'], ['stairs', 'Stair'], ['fixtures', 'Fixture'], ['equipment', 'Equipment'], ['systems', 'System'], ['dimensions', 'Dimension'], ['sections', 'Section'], ['assumptions', 'Assumption'], ['materials', 'Material'], ['beams', 'Beam'], ['columns', 'Column'], ['foundations', 'Foundation'], ['surfaces', 'Surface'], ['plants', 'Plant'], ['plantings', 'Planting']];

      $('#mode-walk').setAttribute('aria-pressed', String(mode === 'walk'));
      render();
    };
    $('#mode-orbit').addEventListener('click', () => setCamera('orbit'));
    $('#mode-walk').addEventListener('click', () => setCamera('walk'));
    $('#download-set').addEventListener('click', downloadDrawingSet);

    viewport.addEventListener('wheel', event => {
      event.preventDefault();
      const rect = viewport.getBoundingClientRect();
      zoomAt(Math.exp(-event.deltaY * 0.0015), event.clientX - rect.left, event.clientY - rect.top);
    }, { passive: false });
    viewport.addEventListener('pointerdown', event => {
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (pointers.size === 1) dragDistance = 0;
      viewport.setPointerCapture(event.pointerId);
      viewport.classList.add('dragging');
    });
    viewport.addEventListener('pointermove', event => {
      const previous = pointers.get(event.pointerId); if (!previous) return;
      const current = { x: event.clientX, y: event.clientY };
      if (pointers.size === 1) {
        dragDistance += Math.hypot(current.x - previous.x, current.y - previous.y);
        if (dragDistance > 4) panBy(current.x - previous.x, current.y - previous.y);
      } else if (pointers.size === 2) {
        const other = [...pointers.entries()].find(([id]) => id !== event.pointerId)[1];
        const before = Math.hypot(previous.x - other.x, previous.y - other.y), after = Math.hypot(current.x - other.x, current.y - other.y);
        const rect = viewport.getBoundingClientRect();
        if (before > 0) zoomAt(after / before, (current.x + other.x) / 2 - rect.left, (current.y + other.y) / 2 - rect.top);
        dragDistance = Infinity;
      }
      pointers.set(event.pointerId, current);
    });
    const release = event => { pointers.delete(event.pointerId); if (!pointers.size) viewport.classList.remove('dragging'); };
    viewport.addEventListener('pointerup', event => {
      if (pointers.size === 1 && dragDistance <= 4) {
        const target = document.elementFromPoint(event.clientX, event.clientY)?.closest?.('[data-entity]');
        select(target?.dataset.entity ?? null);
      }
      release(event);
    });
    viewport.addEventListener('pointercancel', release);
    viewport.addEventListener('keydown', event => {
      const entity = event.target.closest?.('[data-entity]');
      if (entity && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); select(entity.dataset.entity); return; }
      if (event.key === 'Escape' && state.selected) { select(null); return; }
      const step = 48, moves = { ArrowLeft: [step, 0], ArrowRight: [-step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] };
      if (event.target === viewport && moves[event.key]) { event.preventDefault(); panBy(...moves[event.key]); }
      else if (event.key === '+' || event.key === '=') { event.preventDefault(); zoomAt(1.25); }
      else if (event.key === '-' || event.key === '_') { event.preventDefault(); zoomAt(0.8); }
      else if (event.key === '0') { event.preventDefault(); fitSheet(); }
    });
    window.addEventListener('resize', () => {
      if (SHEET_VIEWS.includes(state.view) && !sheetView.adjusted) fitSheet();
      if (state.view === 'model') renderWebGL();
    });
  }

  async function loadModel(params) {
    const embedded = $('#embedded-model')?.textContent?.trim();
    if (!params.get('model') && embedded) return JSON.parse(embedded);
    const modelPath = params.get('model') || './models/building.json';
    const response = await fetch(modelPath, { cache: 'no-store' });
    if (!response.ok) throw new Error(`Model request failed: ${response.status}`);
    return response.json();
  }

  async function start() {
    try {
      const params = new URLSearchParams(location.search);
      state.model = await loadModel(params);
      state.view = resolveView(params.get('view') ?? state.view, state.model);
      const siteTab = $('#tab-site'); if (siteTab) siteTab.hidden = !hasSiteContent(state.model);
      const requestedLevel = params.get('level'); state.levelId = state.model.levels.some(level => level.id === requestedLevel) ? requestedLevel : (sortedLevels(state.model)[0]?.id ?? null);
      const requestedSection = params.get('section'); state.sectionId = (state.model.sections ?? []).some(item => item.id === requestedSection) ? requestedSection : (state.model.sections?.[0]?.id ?? null);
      const requestedElevation = params.get('elevation'); if ([...elevationSelect.options].some(option => option.value === requestedElevation)) state.elevation = requestedElevation;
      state.findings = validateModel(state.model);
      state.approvals = loadApprovals();
      const embeddedCode = params.get('code') ? '' : $('#embedded-code-findings')?.textContent?.trim();
      const codePath = params.get('code') || './reviews/code-findings.json';
      try {
        const codeResponse = embeddedCode ? null : await fetch(codePath, { cache: 'no-store' });
        if (embeddedCode || codeResponse.ok) {
          const data = embeddedCode ? JSON.parse(embeddedCode) : await codeResponse.json();
          const valid = data?.schemaVersion === '1.0.0' && data.projectId === state.model.project.id && Array.isArray(data.findings) && data.coverage && ['researched', 'needs-review', 'unavailable'].includes(data.status);
          state.codeReport = valid ? { status: 'loaded', data } : { status: 'invalid', message: 'The advisory code report is malformed or belongs to another project.' };
        } else if (codeResponse.status !== 404) state.codeReport = { status: 'invalid', message: `The advisory code report request failed with status ${codeResponse.status}.` };
      } catch (error) {
        state.codeReport = { status: 'invalid', message: `The advisory code report could not be read: ${error instanceof Error ? error.message : String(error)}` };
      }
      $('#project-name').textContent = state.model.project.name;
      $('#project-meta').textContent = `${state.model.project.status} · ${profileFor(state.model).label}`;
      if (state.findings.some(item => item.severity === 'error')) {
        showStageStatus('Resolve model errors', 'The drawings stay hidden until every model error in the inspector is fixed.');
        renderInspector();
        return;
      }
      levelSelect.innerHTML = sortedLevels(state.model).map(level => `<option value="${escapeHtml(level.id)}"${level.id === state.levelId ? ' selected' : ''}>${escapeHtml(level.name)}</option>`).join('');
      sectionSelect.innerHTML = (state.model.sections ?? []).map(section => `<option value="${escapeHtml(section.id)}"${section.id === state.sectionId ? ' selected' : ''}>${escapeHtml(section.name)}</option>`).join('');
      elevationSelect.value = state.elevation;
      wireControls();
      render({ refit: true });
      loadManifest();
    } catch (error) {
      showStageStatus('Model unavailable', 'Expected a schema-valid model at models/building.json. The studio does not invent fallback geometry.');
      inspector.innerHTML = `<h2>Model unavailable</h2><p class="lede">${escapeHtml(error instanceof Error ? error.message : String(error))}</p><div class="disclaimer">Expected a schema-valid model at <code>models/building.json</code>. The studio will not invent fallback geometry.</div>`;
    }
  }

  const studioApi = {
    state, PROFILES, DISCIPLINES, MATERIAL_CATEGORIES, HEADER_KINDS, materialContext, materialsActive, wallBands, segmentPolygonIntervals, triangulate, pushExtrusion, validateModel, profileFor, selectScale, createPlacer, placeExtent, drawingArea,
    bulgeArc, curvePoints, curvePathD, curveLength, ringOf, curveIssues, pathIssues, polygonArea, pointInPolygon, wallGeometry, wallLength, wallEndClip, terrainOf, siteExtent,
    renderPlanSheet, renderElevationSheet, renderSectionSheet, renderSitePlanSheet, sectionGeometry, renderDrawingSet, modelFingerprint, hasSiteContent, availableViews, resolveView, plantSchedule, plantingQuantity, bearingLabel,
    planSvg, elevationSvg, sectionSvg, buildScene, pushPrism, rectangleBounds, renderDocument, zipFiles, crc32, formatLength, entityDetails, approvalsExport
  };
  if (typeof globalThis.__ARCHITECTURE_STUDIO_API__ === 'function') globalThis.__ARCHITECTURE_STUDIO_API__(studioApi);
  else start();
})();
