<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture Studio</title>
<style>
  /* Viewer chrome tokens. See references/viewer-chrome.md. Drawing sheets carry their own
     drafting styles inline (references/drafting-standard.md) and never read these. */
  :root {
    --paper: #f3f0e8;
    --sheet: #fbfaf6;
    --panel: #ebe7dd;
    --ink: #1f2420;
    --muted: #4f5650;
    --line: #d3d0c6;
    --control-line: #767b75;
    --accent: #b64b34;
    --canvas: #dcdad3;
    --error: #a22e2e;
    --warning: #7d5208;
    --advisory: #3f5660;
    --sans: "Aptos", "Segoe UI", system-ui, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --mono: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
    --control-h: 36px;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
  }
  @media (pointer: coarse), (max-width: 900px) { :root { --control-h: 44px; } }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body { overflow: hidden; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .hidden-view { display: none !important; }

  .app { display: grid; grid-template-rows: auto minmax(0, 1fr); width: 100%; height: 100%; min-width: 0; }
  .masthead { display: flex; align-items: stretch; min-width: 0; border-bottom: 1px solid var(--line); background: var(--sheet); }
  .brand { display: flex; flex-direction: column; justify-content: center; gap: 2px; width: 280px; flex: none; padding: 8px 18px; border-right: 1px solid var(--line); min-width: 0; }
  .brand strong { overflow: hidden; font: 600 18px/1.2 var(--serif); text-overflow: ellipsis; white-space: nowrap; }
  .brand span { color: var(--muted); font-size: 12px; }
  .tabs { display: flex; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
  .tab {
    position: relative; flex: none; min-height: 52px; padding: 0 16px; border: 0; border-right: 1px solid var(--line);
    background: transparent; color: var(--muted); font-weight: 600; font-size: 14px;
    transition: background-color 160ms var(--ease), color 160ms var(--ease);
  }
  .tab:hover { color: var(--ink); background: #f1eee6; }
  .tab[aria-selected="true"] { color: var(--ink); background: var(--paper); }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; inset: auto 0 -1px; height: 3px; background: var(--accent); }
  .tab:focus-visible { outline-offset: -3px; }

  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 0; }
  .stage { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--paper); }
  .field { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .group { display: flex; align-items: center; gap: 4px; }
  select, .tool {
    min-height: var(--control-h); border: 1px solid var(--control-line); border-radius: 4px;
    background: var(--sheet); padding: 0 12px; font-size: 14px;
    transition: background-color 160ms var(--ease), border-color 160ms var(--ease);
  }
  .tool.icon { min-width: var(--control-h); padding: 0; font-size: 18px; line-height: 1; }
  .tool:hover, select:hover { border-color: var(--ink); }
  .tool[aria-pressed="true"] { color: var(--sheet); background: var(--ink); border-color: var(--ink); }
  .tool[aria-pressed="false"] { color: var(--muted); }
  .tool.primary { margin-left: auto; color: var(--sheet); background: var(--ink); border-color: var(--ink); }
  .tool.primary:hover { background: #343b36; }
  .swatch { display: inline-block; width: 16px; height: 0; margin-right: 6px; border-top: 3px solid; vertical-align: middle; }

  .canvas-wrap { position: relative; min-height: 0; overflow: hidden; background: var(--canvas); }
  .sheet-viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
  .sheet-viewport.dragging { cursor: grabbing; }
  .sheet-viewport:focus-visible { outline-offset: -3px; }
  .sheet-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .sheet-stage svg { display: block; box-shadow: 0 2px 10px rgba(31, 36, 32, .18); }
  .sheet [data-entity] { cursor: pointer; outline: none; }
  .sheet [data-entity]:hover > :not(text), .sheet [data-entity]:hover:not(g) { stroke: var(--accent) !important; }
  .sheet [data-entity].is-selected > :not(text), .sheet [data-entity].is-selected:not(g),
  .sheet [data-entity]:focus-visible > :not(text), .sheet [data-entity]:focus-visible:not(g) { stroke: var(--accent) !important; stroke-width: 0.9px; }
  #model3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #dfe6e2; }
  #model3d:focus-visible { outline-offset: -3px; }
  #content { position: absolute; inset: 0; overflow: auto; padding: 32px clamp(20px, 5vw, 64px); background: var(--sheet); }
  .stage-status { position: absolute; inset: 0; display: grid; place-content: center; gap: 6px; padding: 24px; text-align: center; color: var(--muted); background: var(--canvas); }
  .stage-status strong { color: var(--ink); font: 600 20px/1.2 var(--serif); }
  .model-help { position: absolute; right: 14px; bottom: 14px; padding: 8px 10px; border: 1px solid var(--line); background: rgba(251, 250, 246, .94); color: var(--muted); font-size: 12px; }
  .toast { position: absolute; left: 14px; bottom: 14px; max-width: min(520px, calc(100% - 28px)); margin: 0; padding: 10px 12px; border: 1px solid var(--control-line); background: var(--sheet); color: var(--ink); font-size: 14px; }
  .toast:empty { display: none; }

  aside { min-width: 0; min-height: 0; overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); }
  .inspector { min-width: 0; padding: 20px; overflow-wrap: anywhere; }
  .inspector h2 { margin: 0 0 8px; font: 600 22px/1.15 var(--serif); }
  .inspector h3 { margin: 22px 0 8px; font-size: 14px; }
  .lede { margin: 0; color: var(--muted); font-size: 14px; }
  .metric { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; margin: 16px 0 0; }
  .metric dt { color: var(--muted); font-size: 14px; }
  .metric dd { margin: 0; font: 600 14px/1.45 var(--mono); text-align: right; }
  .diagnostics { display: grid; gap: 6px; }
  .finding { display: block; width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--sheet); text-align: left; }
  button.finding:hover { border-color: var(--ink); }
  .finding b { display: block; font-size: 12px; }
  .finding .severity { font-weight: 700; }
  .finding.error .severity { color: var(--error); }
  .finding.warning .severity { color: var(--warning); }
  .finding.advisory .severity { color: var(--advisory); }
  .finding > span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
  .disclaimer { margin-top: 18px; border: 1px solid #c8a97a; background: #f7edda; padding: 10px 11px; color: #5a4420; font-size: 12px; }
  .page { max-width: 880px; margin: 0 auto; }
  .page h1 { margin: 0 0 12px; font: 600 clamp(28px, 4vw, 44px)/1.05 var(--serif); max-width: 18ch; }
  .page h2 { margin: 30px 0 10px; font: 600 20px/1.15 var(--serif); }
  .page p { color: var(--muted); max-width: 70ch; }
  .page table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  .page th, .page td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: left; vertical-align: top; }
  .page th { color: var(--muted); font-size: 14px; }
  .page tr[data-entity] { cursor: pointer; }
  .page tr[data-entity]:hover { background: #f1eee6; }
  .page .finding { margin-top: 8px; }
  .empty { border: 1px dashed var(--control-line); padding: 18px; color: var(--muted); }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100%; }
    .masthead { flex-wrap: wrap; }
    .brand { width: 100%; border-right: 0; border-bottom: 1px solid var(--line); }
    .tabs { width: 100%; }
    .workspace { grid-template-columns: 1fr; }
    .stage { grid-template-rows: auto 62vh; }
    aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
    .tool.primary { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="brand"><strong id="project-name">Architecture Studio</strong><span id="project-meta">Loading the building model</span></div>
    <div class="tabs" role="tablist" aria-label="Studio views">
      <button class="tab" role="tab" id="tab-plan" data-view="plan" aria-selected="true" aria-controls="stage" tabindex="0">Plans</button>
      <button class="tab" role="tab" id="tab-elevation" data-view="elevation" aria-selected="false" aria-controls="stage" tabindex="-1">Elevations</button>
      <button class="tab" role="tab" id="tab-section" data-view="section" aria-selected="false" aria-controls="stage" tabindex="-1">Sections</button>
      <button class="tab" role="tab" id="tab-systems" data-view="systems" aria-selected="false" aria-controls="stage" tabindex="-1">Systems</button>
      <button class="tab" role="tab" id="tab-model" data-view="model" aria-selected="false" aria-controls="stage" tabindex="-1">3D model</button>
      <button class="tab" role="tab" id="tab-code" data-view="code" aria-selected="false" aria-controls="stage" tabindex="-1">Code review</button>
      <button class="tab" role="tab" id="tab-assumptions" data-view="assumptions" aria-selected="false" aria-controls="stage" tabindex="-1">Assumptions</button>
    </div>
  </header>
  <div class="workspace">
    <section class="stage" id="stage" role="tabpanel" aria-labelledby="tab-plan">
      <div class="toolbar">
        <label class="field" id="level-control"><span>Level</span><select id="level"></select></label>
        <label class="field hidden-view" id="elevation-control"><span>Face</span><select id="elevation"><option value="north">North</option><option value="east">East</option><option value="south">South</option><option value="west">West</option></select></label>
        <label class="field hidden-view" id="section-control"><span>Section</span><select id="section"></select></label>
        <div class="group" id="zoom-controls" role="group" aria-label="Sheet zoom">
          <button class="tool icon" id="zoom-out" aria-label="Zoom out">&minus;</button>
          <button class="tool" id="zoom-fit">Fit sheet</button>
          <button class="tool icon" id="zoom-in" aria-label="Zoom in">+</button>
        </div>
        <div class="group hidden-view" id="camera-controls" role="group" aria-label="Camera">
          <button class="tool" id="mode-orbit" aria-pressed="true">Orbit</button>
          <button class="tool" id="mode-walk" aria-pressed="false">Walk</button>
        </div>
        <div class="group hidden-view" id="system-controls" role="group" aria-label="Systems shown">
          <button class="tool system-toggle" data-system="plumbing" aria-pressed="true"><span class="swatch" style="color:#1d5fa8"></span>Plumbing</button>
          <button class="tool system-toggle" data-system="electrical" aria-pressed="true"><span class="swatch" style="color:#9c2f8f"></span>Electrical</button>
          <button class="tool system-toggle" data-system="mechanical" aria-pressed="true"><span class="swatch" style="color:#1f7a4d"></span>Mechanical</button>
        </div>
        <button class="tool primary" id="download-set" aria-describedby="download-status">Download drawing set</button>
      </div>
      <div class="canvas-wrap">
        <div id="sheet-viewport" class="sheet-viewport" tabindex="0" role="region" aria-label="Drawing sheet. Arrow keys pan, plus and minus zoom, 0 fits the sheet."><div id="sheet-stage" class="sheet-stage sheet"></div></div>
        <canvas id="model3d" class="hidden-view" tabindex="0" aria-label="Interactive three-dimensional concept model. Arrow keys orbit, plus and minus zoom."></canvas>
        <article id="content" class="hidden-view"></article>
        <div id="model-help" class="model-help hidden-view">Drag or use arrow keys to look. Scroll or press plus and minus to zoom.<br>Walk mode: W A S D to move, Q and E to change height.</div>
        <div id="stage-status" class="stage-status"><strong>Loading the building model</strong><span>Reading models/building.json.</span></div>
        <p id="download-status" class="toast" role="status" aria-live="polite"></p>
      </div>
    </section>
    <aside aria-label="Inspector"><div class="inspector" id="inspector"><h2>Loading</h2><p class="lede">Reading the canonical building model.</p></div></aside>
  </div>
</div>

    return `${sign}${feet}'-${inches}${fraction ? ` ${fractions[fraction]}` : ''}"`;

  function allEntityIds(model) {
    const groups = ['levels', 'spaces', 'walls', 'openings', 'slabs', 'roofs', 'stairs', 'fixtures', 'equipment', 'systems', 'dimensions', 'sections', 'viewpoints', 'assumptions'];
    const entities = model?.project ? [model.project] : [];
    for (const group of groups) entities.push(...(model[group] ?? []));
    for (const system of model?.systems ?? []) entities.push(...(system.nodes ?? []), ...(system.edges ?? []));

  const isFiniteInteger = value => Number.isInteger(value) && Number.isFinite(value);
  const samePoint = (a, b, tolerance = 0) => Math.hypot(a.x - b.x, a.y - b.y, (a.z ?? 0) - (b.z ?? 0)) <= tolerance;
  const orientation = (a, b, c) => Math.sign((b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x));
  const onSegment = (a, b, p) => Math.min(a.x, b.x) <= p.x && p.x <= Math.max(a.x, b.x) && Math.min(a.y, b.y) <= p.y && p.y <= Math.max(a.y, b.y);
  function segmentsIntersect(a, b, c, d) {

    if (abC !== abD && cdA !== cdB) return true;
    return (abC === 0 && onSegment(a, b, c)) || (abD === 0 && onSegment(a, b, d)) || (cdA === 0 && onSegment(c, d, a)) || (cdB === 0 && onSegment(c, d, b));

  function polygonIssues(points) {
    if (!Array.isArray(points) || points.length < 3) return ['fewer than three points'];
    const distinct = new Set(points.map(point => `${point.x},${point.y}`));
    const issues = [];
    if (distinct.size < 3) issues.push('fewer than three distinct points');
    const area = points.reduce((sum, point, index) => {
      const next = points[(index + 1) % points.length];
      return sum + point.x * next.y - next.x * point.y;
    }, 0) / 2;
    if (Math.abs(area) < 1) issues.push('zero area');
    for (let i = 0; i < points.length; i += 1) {
      const a = points[i], b = points[(i + 1) % points.length];
      for (let j = i + 1; j < points.length; j += 1) {
        if (j === i || j === (i + 1) % points.length || (i === 0 && j === points.length - 1)) continue;

  }

  function renderPlanSheet(model, levelId, options = {}) {
    const profile = profileFor(model), P = profile.pens, T = profile.text;
    const screened = Boolean(options.systems);
    const ink = screened ? DRAFT.screen : DRAFT.ink, poche = screened ? DRAFT.screenPoche : DRAFT.poche;
    // Screened lettering stays darker than screened linework so it keeps 4.5:1 on white paper.
    const textInk = screened ? DRAFT.screenText : DRAFT.ink;
    const levels = sortedLevels(model);
    const level = levels.find(item => item.id === levelId) ?? levels[0];
    const levelIndex = levels.indexOf(level);
    const tolerance = model.project.coordinates.toleranceMm ?? 3;
    const ext = planExtent(model), area = drawingArea(profile);
    const { ratio, label: scaleLabel } = selectScale(profile, ext.maxX - ext.minX, ext.maxY - ext.minY, area);
    const place = placeExtent(area, ratio, ext.maxX - ext.minX, ext.maxY - ext.minY);
    const map = p => ({ x: place.x + (p.x - ext.minX) / ratio, y: place.y + (ext.maxY - p.y) / ratio });
    const placer = createPlacer(area), warnings = [];
    const walls = model.walls.filter(wall => wall.levelId === level.id);
    const wallBox = walls.length ? boundsOf(walls.flatMap(wall => [wall.start, wall.end])) : boundsOf(model.spaces.flatMap(space => space.boundary));
    const center = { x: (wallBox.x0 + wallBox.x1) / 2, y: (wallBox.y0 + wallBox.y1) / 2 };
    const layers = { rooms: [], roof: [], objects: [], stairs: [], wallStroke: [], wallFill: [], openings: [], marks: [], dims: [], tags: [], systems: [] };

    for (const space of model.spaces.filter(item => item.levelId === level.id)) {
      layers.rooms.push(`<g data-entity="${escapeHtml(space.id)}">${svgPoly(space.boundary.map(map), { fill: DRAFT.paper, fillOpacity: 0, width: 0 })}</g>`);
    }
    for (const roof of model.roofs.filter(item => item.levelId === level.id)) {
      const box = boundsOf(roof.footprint), ov = roof.overhangMm ?? 0;
      layers.roof.push(`<g data-entity="${escapeHtml(roof.id)}">${svgPoly([{ x: box.x0 - ov, y: box.y0 - ov }, { x: box.x1 + ov, y: box.y0 - ov }, { x: box.x1 + ov, y: box.y1 + ov }, { x: box.x0 - ov, y: box.y1 + ov }].map(map), { stroke: ink, width: P.thin, dash: '3 1.5' })}</g>`);
    }
    for (const object of [...model.fixtures, ...model.equipment].filter(item => item.levelId === level.id)) {
      const corners = rotatedRect(object.position, object.size.x, object.size.y, object.rotationDeg).map(map);
      layers.objects.push(`<g data-entity="${escapeHtml(object.id)}">${svgPoly(corners, { fill: DRAFT.paper, stroke: ink, width: P.thin })}</g>`);
      placer.reserve(boundsOf(corners));
    }

    for (const stair of model.stairs) {
      const from = model.levels.find(item => item.id === stair.fromLevelId), to = model.levels.find(item => item.id === stair.toLevelId);
      const isLower = stair.fromLevelId === level.id, isUpper = stair.toLevelId === level.id;
      if (!from || !to || (!isLower && !isUpper)) continue;
      const u = unit2(sub(stair.end, stair.start)), n = perp(u), L = Math.hypot(stair.end.x - stair.start.x, stair.end.y - stair.start.y), half = stair.widthMm / 2;

      const rise = (to.elevationMm - from.elevationMm) / stair.riserCount;

      const cutRun = cutIndex / stair.riserCount * L;

      for (let i = 1; i < stair.riserCount; i += 1) {
        const r = i / stair.riserCount * L;
        parts.push(svgLine(at(r, -half), at(r, half), { stroke: ink, width: P.thin, dash: isLower && i > cutIndex ? '3 1.5' : null }));
      }
      if (isLower) {
        parts.push(svgLine(at(0, -half), at(0, half), { stroke: ink, width: P.medium }));
        for (const side of [-half, half]) {
          parts.push(svgLine(at(0, side), at(cutRun, side), { stroke: ink, width: P.medium }));
          parts.push(svgLine(at(cutRun, side), at(L, side), { stroke: ink, width: P.thin, dash: '3 1.5' }));
        }
        parts.push(svgLine(at(cutRun - half * 0.45, -half * 1.15), at(cutRun + half * 0.45, half * 1.15), { stroke: ink, width: P.medium }));
      } else {

      }
      const tail = isLower ? 0.06 * L : L - 0.06 * L, head = isLower ? cutRun - half * 0.7 : 0.25 * L;
      const tailP = at(tail, 0), headP = at(head, 0), dir = unit2(sub(headP, tailP)), wing = perp(dir);
      parts.push(svgLine(tailP, headP, { stroke: ink, width: P.thin }));
      parts.push(svgPoly([headP, add(sub(headP, mul(dir, 2.2)), mul(wing, 0.9)), sub(sub(headP, mul(dir, 2.2)), mul(wing, 0.9))], { fill: ink, width: 0 }));
      parts.push(svgCircle(tailP, 0.6, { fill: ink, width: 0 }));
      // The label sits just past the end of the run so it never lands on treads.
      const edgeP = at(isLower ? 0 : L, 0), labelP = sub(edgeP, mul(dir, T.note * 1.4));
      parts.push(svgText(labelP.x, labelP.y + T.note * 0.36, isLower ? 'UP' : 'DN', T.note, { fill: textInk, weight: 700 }));
      layers.stairs.push(`<g data-entity="${escapeHtml(stair.id)}">${parts.join('')}</g>`);
      placer.reserve(boundsOf(stairCorners(stair).map(map)));
      placer.reserve(centeredBox(labelP, 6, 4));
    }

    for (const wall of walls) {
      const L = Math.hypot(wall.end.x - wall.start.x, wall.end.y - wall.start.y), u = unit2(sub(wall.end, wall.start)), n = perp(u), t = wall.thicknessMm;
      const inward = dot2(sub(center, mul(add(wall.start, wall.end), 0.5)), n) >= 0 ? 1 : -1;
      const openings = model.openings.filter(item => item.wallId === wall.id).sort((a, b) => a.offsetMm - b.offsetMm);
      const p = (along, side) => map(add(add(wall.start, mul(u, along)), mul(n, side)));
      const startExt = wallEndJoined(wall, wall.start, walls, tolerance) ? t / 2 : 0, endExt = wallEndJoined(wall, wall.end, walls, tolerance) ? t / 2 : 0;
      const solids = []; let cursor = -startExt;
      for (const opening of openings) { solids.push([cursor, opening.offsetMm]); cursor = opening.offsetMm + opening.widthMm; }
      solids.push([cursor, L + endExt]);
      const strokeParts = [], fillParts = [];
      for (const [a, b] of solids) {
        if (b - a < 1) continue;
        const corners = [p(a, -t / 2), p(b, -t / 2), p(b, t / 2), p(a, t / 2)];
        strokeParts.push(svgPoly(corners, { fill: poche, stroke: ink, width: P.cut * 2, join: 'miter' }));
        fillParts.push(svgPoly(corners, { fill: poche, width: 0, inert: true }));
      }
      layers.wallStroke.push(`<g data-entity="${escapeHtml(wall.id)}">${strokeParts.join('')}</g>`);
      layers.wallFill.push(fillParts.join(''));
      placer.reserveSegment(p(-startExt, 0), p(L + endExt, 0), t / ratio / 2 + 0.8);

      for (const opening of openings) {
        const a = opening.offsetMm, b = a + opening.widthMm, w = opening.widthMm, parts = [];
        parts.push(svgPoly([p(a, -t / 2), p(b, -t / 2), p(b, t / 2), p(a, t / 2)], { fill: DRAFT.paper, fillOpacity: 0, width: 0 }));
        if (opening.kind === 'window') {
          for (const side of [-t / 2, t / 2]) parts.push(svgLine(p(a, side), p(b, side), { stroke: ink, width: P.thin }));
          for (const side of [-t * 0.12, t * 0.12]) parts.push(svgLine(p(a, side), p(b, side), { stroke: ink, width: P.thin }));
        } else if (opening.kind === 'overhead-door') {
          parts.push(svgLine(p(a, 0), p(b, 0), { stroke: ink, width: P.thin, dash: '3 1.5' }));
          parts.push(svgLine(p(a, inward * (t / 2 + 600)), p(b, inward * (t / 2 + 600)), { stroke: ink, width: P.thin, dash: '3 1.5' }));
        } else if (opening.kind === 'door') {
          const swing = opening.swing ?? 'left', face = inward * t / 2;
          const leaf = (hingeAlong, closedAlong, width) => {

            const sweep = cross2(sub(tip, hinge), sub(closed, hinge)) > 0 ? 1 : 0, r = width / ratio;
            return svgLine(hinge, tip, { stroke: ink, width: P.medium }) + `<path d="M${num(tip.x)},${num(tip.y)} A${num(r)},${num(r)} 0 0 ${sweep} ${num(closed.x)},${num(closed.y)}" fill="none" ${strokeAttrs({ stroke: ink, width: P.fine })}/>`;

          }
          if (swing !== 'sliding' && swing !== 'none') placer.reserve(boundsOf([p(a, face), p(b, face), p(a, inward * (t / 2 + w)), p(b, inward * (t / 2 + w))]));

    }

    const centerPaper = map(center);
    for (const dimension of model.dimensions ?? []) {
      if (dimension.kind === 'elevation' || Math.abs(dimension.from.z - level.elevationMm) > tolerance || Math.abs(dimension.to.z - level.elevationMm) > tolerance) continue;
      const a = map(dimension.from), b = map(dimension.to);
      const measured = dimension.kind === 'horizontal' ? Math.abs(dimension.to.x - dimension.from.x) : dimension.kind === 'vertical' ? Math.abs(dimension.to.y - dimension.from.y) : Math.hypot(dimension.to.x - dimension.from.x, dimension.to.y - dimension.from.y);

      layers.dims.push(`<g data-entity="${escapeHtml(dimension.id)}">${dimensionPaper(a, b, dimension.kind, side, offset, profile.dimension(measured), { ...profile, pens: P }, placer)}</g>`);
    }

    for (const section of model.sections ?? []) {
      const s = map(section.start), e = map(section.end), d = unit2(sub(e, s));
      const look = section.lookDirection === 'left' ? perp(unit2(sub(section.end, section.start))) : mul(perp(unit2(sub(section.end, section.start))), -1);
      const lookPaper = unit2({ x: look.x, y: -look.y }), r = 5, letter = sectionLetter(model, section.id), sheet = sectionSheetId(model, section.id);
      // Each bubble slides outward along the cut line until it clears dimensions and other marks.

      const reachStart = clearReach(s, mul(d, -1)), reachEnd = clearReach(e, d);

    }

    const legend = [];
    if (screened) {

      for (const system of model.systems) {
        if (!options.systems.has(system.discipline)) continue;
        const style = DISCIPLINES[system.discipline];
        legend.push({ label: style.label, color: style.color, dash: style.dash });
        for (const edge of system.edges) {
          const segments = [];
          for (let index = 1; index < edge.path.length; index += 1) {
            const segment = clipSegmentToBand(edge.path[index - 1], edge.path[index], band);
            if (!segment || samePoint(segment[0], segment[1])) continue;
            segments.push(svgLine(map(segment[0]), map(segment[1]), { stroke: style.color, width: P.profile, dash: style.dash, cap: 'round' }));
            placer.reserveSegment(map(segment[0]), map(segment[1]), 0.8);
          }
          if (segments.length) layers.systems.push(`<g data-entity="${escapeHtml(edge.id)}">${segments.join('')}</g>`);
        }
        for (const node of system.nodes) {
          if (node.levelId ? node.levelId !== level.id : node.position.z < band.min || node.position.z >= band.max) continue;
          layers.systems.push(`<g data-entity="${escapeHtml(node.id)}">${svgCircle(map(node.position), 1.1, { fill: style.color, stroke: DRAFT.paper, width: 0.3 })}</g>`);
        }
      }
    }

    for (const space of model.spaces.filter(item => item.levelId === level.id)) {
      const poly = space.boundary.map(map), name = space.name.toUpperCase(), areaLabel = profile.area(polygonArea(space.boundary));
      const box = boundsOf(poly), c = map(centroid(space.boundary));
      const attempt = lines => {
        const w = Math.max(...lines.map(line => textWidth(line.text, line.size))) + 1.2, h = lines.reduce((sum, line) => sum + line.size * 1.25, 0) + 0.6;
        const candidates = [c];
        for (let dy = -(box.y1 - box.y0) / 2; dy <= (box.y1 - box.y0) / 2; dy += 2) for (let dx = -(box.x1 - box.x0) / 2; dx <= (box.x1 - box.x0) / 2; dx += 2) candidates.push({ x: c.x + dx, y: c.y + dy });
        candidates.sort((p, q) => Math.hypot(p.x - c.x, p.y - c.y) - Math.hypot(q.x - c.x, q.y - c.y));
        for (const candidate of candidates) {
          const tagBox = centeredBox(candidate, w, h);
          const corners = [{ x: tagBox.x0, y: tagBox.y0 }, { x: tagBox.x1, y: tagBox.y0 }, { x: tagBox.x1, y: tagBox.y1 }, { x: tagBox.x0, y: tagBox.y1 }];
          if (corners.every(corner => pointInPolygon(corner, poly)) && placer.fits(tagBox)) return { candidate, tagBox };
        }
        return null;
      };
      const full = [{ text: name, size: T.room }, { text: areaLabel, size: T.note }];
      let lines = full, spot = attempt(full);
      if (!spot) { lines = [full[0]]; spot = attempt(lines); }
      let leader = '';
      if (!spot) {
        lines = full;
        const w = Math.max(textWidth(name, T.room), textWidth(areaLabel, T.note)) + 1.2, h = T.room * 1.25 + T.note * 1.25 + 0.6;
        const right = map({ x: ext.maxX, y: 0 }).x + 8 + w / 2;
        for (let y = area.y0 + h / 2; y <= area.y1 - h / 2 && !spot; y += 2) {
          const tagBox = centeredBox({ x: right, y }, w, h);
          if (placer.fits(tagBox)) spot = { candidate: { x: right, y }, tagBox };
        }
        if (spot) leader = svgLine(c, { x: spot.tagBox.x0 - 0.5, y: spot.candidate.y }, { stroke: ink, width: P.fine }) + svgCircle(c, 0.5, { fill: ink, width: 0 });

      if (!spot) {
        warnings.push({ severity: 'warning', code: 'label.placement', message: `${space.name}: no clear position for the room tag on ${level.name}.`, entityId: space.id });

      }
      placer.reserve(spot.tagBox);
      const total = lines.reduce((sum, line) => sum + line.size * 1.25, 0);
      let y = spot.candidate.y - total / 2;
      const text = lines.map(line => { y += line.size * 1.25; return svgText(spot.candidate.x, y - line.size * 0.25, line.text, line.size, { fill: textInk, weight: line.size === T.room ? 700 : null, upper: line.size === T.room }); }).join('');
      layers.tags.push(`<g data-entity="${escapeHtml(space.id)}">${leader}${text}</g>`);
    }

    const title = screened ? `${level.name} systems coordination` : `${level.name} plan`;
    const sheetId = screened ? `M-1${String(levelIndex + 1).padStart(2, '0')}` : `A-1${String(levelIndex + 1).padStart(2, '0')}`;
    const body = ['rooms', 'roof', 'objects', 'stairs', 'wallStroke', 'wallFill', 'openings', 'marks', 'dims', 'tags', 'systems']
      .map(key => `<g data-layer="${key}">${layers[key].join('')}</g>`).join('');
    const svg = sheetSvg(model, profile, { sheetId, title, scaleLabel, ratio, area, view: screened ? 'systems' : 'plan', northDeg: model.project.coordinates.trueNorthDeg ?? 0, legend }, body);
    return { svg, sheetId, title, view: screened ? 'systems' : 'plan', ratio, scaleLabel, warnings };
  }

  function elevationBasis(side, bounds) {
    const definitions = {
      north: { axis: 'y', face: bounds.maxY, project: point => -point.x, label: 'North' },
      south: { axis: 'y', face: bounds.minY, project: point => point.x, label: 'South' },
      east: { axis: 'x', face: bounds.maxX, project: point => point.y, label: 'East' },
      west: { axis: 'x', face: bounds.minX, project: point => -point.y, label: 'West' }
    };
    return definitions[side];
  }

  function renderVerticalSheet(model, view, meta, build) {
    // Shared frame for elevations and sections: build(hz) returns { minH, maxH, minZ, maxZ, draw(map, ratio, placer) }.
    const profile = profileFor(model), area = drawingArea(profile);
    const extent = build.extent;
    const extra = { x: 46, y: 0 };
    const width = extent.maxH - extent.minH, height = extent.maxZ - extent.minZ;
    const { ratio, label: scaleLabel } = selectScale(profile, width, height, area, extra);
    const place = placeExtent(area, ratio, width, height, extra);
    const map = (h, z) => ({ x: place.x + (h - extent.minH) / ratio, y: place.y + (extent.maxZ - z) / ratio });
    const placer = createPlacer(area), warnings = [];
    const body = build.draw({ map, ratio, profile, placer, warnings, place });
    const svg = sheetSvg(model, profile, { ...meta, scaleLabel, ratio, area, view }, body);
    return { svg, sheetId: meta.sheetId, title: meta.title, view, ratio, scaleLabel, warnings };
  }

  function verticalAnnotations(model, ctx, minH, maxH, roof) {
    const { map, profile, placer } = ctx, P = profile.pens, parts = [];
    const ground = model.project.coordinates.siteDatumMm ?? 0;
    const left = map(minH, 0).x, right = map(maxH, 0).x;
    parts.push(svgLine({ x: left - 8, y: map(minH, ground).y }, { x: right + 8, y: map(minH, ground).y }, { width: P.ground }));
    const datums = sortedLevels(model).map(level => ({ name: level.name, z: level.elevationMm }));
    if (roof) datums.push({ name: 'Eave', z: roof.eaveElevationMm }, { name: 'Ridge', z: roof.ridgeElevationMm });
    for (const item of datums) parts.push(datum(left - 4, right + 6, map(minH, item.z).y, item.name, item.z, profile));
    for (const dimension of (model.dimensions ?? []).filter(item => item.kind === 'elevation')) {
      const a = map(minH, dimension.from.z), b = map(minH, dimension.to.z);
      parts.push(`<g data-entity="${escapeHtml(dimension.id)}">${dimensionPaper({ x: left, y: a.y }, { x: left, y: b.y }, 'vertical', { x: -1, y: 0 }, Math.max(Math.abs(dimension.offsetMm ?? 0) / ctx.ratio, 10), profile.dimension(Math.abs(dimension.to.z - dimension.from.z)), profile, placer)}</g>`);
    }
    return parts.join('');
  }

  function renderElevationSheet(model, side) {
    const bounds = modelBounds(model), roof = model.roofs[0], basis = elevationBasis(side, bounds);
    const wallBox = boundsOf(model.walls.flatMap(wall => [wall.start, wall.end]));

    const ridge = roof?.ridgeElevationMm ?? wallTop, eave = roof?.eaveElevationMm ?? wallTop;
    const gable = roof ? ((side === 'north' || side === 'south') ? roof.ridgeAxis === 'y' : roof.ridgeAxis === 'x') : false;
    const isVisibleWall = wall => Math.abs(wall.start[basis.axis] - basis.face) < 3 && Math.abs(wall.end[basis.axis] - basis.face) < 3;
    return renderVerticalSheet(model, 'elevation', { sheetId: ELEVATION_SHEETS[side], title: `${basis.label} elevation` }, {
      extent: { minH, maxH, minZ: Math.min(0, model.project.coordinates.siteDatumMm ?? 0), maxZ: Math.max(ridge, eave, wallTop) },

            inner.push(svgPoly([map(left + inset, top - inset), map(right - inset, top - inset), map(right - inset, bottom + inset), map(left + inset, bottom + inset)], { width: P.thin }));

          } else if (opening.kind === 'overhead-door') {
            for (let i = 1; i < 4; i += 1) inner.push(svgLine(map(left, bottom + opening.heightMm * i / 4), map(right, bottom + opening.heightMm * i / 4), { width: P.thin }));

  }

  // Sutherland-Hodgman clip of a polygon to the half plane f(p) >= 0.
  function clipHalfPlane(points, f) {
    const out = [];

  function clipSegmentToConvex(p0, p1, polygon) {

    for (const p of sorted) { while (lower.length >= 2 && turn(lower.at(-2), lower.at(-1), p) <= 0) lower.pop(); lower.push(p); }

    return { ext, corners, ridgeEnds, zAt, alongX, mid };
  }

  // Section geometry per references/coordinate-contract.md "Section Views".
  function sectionGeometry(model, section) {
    const d = unit2(sub(section.end, section.start)), lengthAlong = Math.hypot(section.end.x - section.start.x, section.end.y - section.start.y);
    const n = section.lookDirection === 'left' ? perp(d) : mul(perp(d), -1), sign = section.lookDirection === 'left' ? 1 : -1;
    const hOf = p => sign * dot2(sub(p, section.start), d), sOf = p => dot2(sub(p, section.start), n);
    const levelOf = id => model.levels.find(level => level.id === id);

    const at = t => add(section.start, mul(d, t * lengthAlong));
    const hRange = points => { const hs = points.map(hOf); return [Math.min(...hs), Math.max(...hs)]; };

    for (const wall of model.walls) {
      const level = levelOf(wall.levelId), base = (level?.elevationMm ?? 0) + (wall.baseOffsetMm ?? 0), t = wall.thicknessMm;
      const u = unit2(sub(wall.end, wall.start)), nw = perp(u), L = Math.hypot(wall.end.x - wall.start.x, wall.end.y - wall.start.y);
      const rect = [add(wall.start, mul(nw, t / 2)), add(wall.end, mul(nw, t / 2)), sub(wall.end, mul(nw, t / 2)), sub(wall.start, mul(nw, t / 2))];

      const openings = model.openings.filter(item => item.wallId === wall.id);
      if (crossing) {
        const [h0, h1] = hRange([at(crossing[0]), at(crossing[1])]);

        const hit = openings.find(item => along >= item.offsetMm && along <= item.offsetMm + item.widthMm);
        const spans = hit ? [[base, base + hit.sillMm], [base + hit.sillMm + hit.heightMm, base + wall.heightMm]] : [[base, base + wall.heightMm]];
        for (const [z0, z1] of spans) if (z1 - z0 > 1) cut.push({ id: wall.id, kind: 'wall', h0, h1, z0, z1 });

    }
    for (const slab of model.slabs) {
      const level = levelOf(slab.levelId), top = level?.elevationMm ?? 0, bottom = top - slab.thicknessMm;
      const crossing = clipSegmentToConvex(section.start, section.end, slab.boundary);
      if (crossing) { const [h0, h1] = hRange([at(crossing[0]), at(crossing[1])]); cut.push({ id: slab.id, kind: 'slab', h0, h1, z0: bottom, z1: top }); }

      const corners = stairCorners(stair), crossing = clipSegmentToConvex(section.start, section.end, corners);
      const parallel = Math.abs(dot2(u, d)) >= 0.3;
      let profile;
      if (parallel) {
        const run = r => hOf(add(stair.start, mul(u, r)));
        profile = [{ h: run(0), z: from.elevationMm }];
        for (let i = 0; i < stair.riserCount; i += 1) {
          const r0 = i / stair.riserCount * L, r1 = (i + 1) / stair.riserCount * L, z = from.elevationMm + rise * (i + 1);

        const [h0, h1] = hRange(corners);

          const along = dot2(sub(at((crossing[0] + crossing[1]) / 2), stair.start), u);

    }
    for (const object of [...model.fixtures, ...model.equipment]) {
      const corners = rotatedRect(object.position, object.size.x, object.size.y, object.rotationDeg), ss = corners.map(sOf);
      if (Math.max(...ss) <= 0) continue;

  function renderSectionSheet(model, sectionId) {

  }

  // Full drawing set for the model. scripts/export-drawings.ts writes these files; the viewer
  // only downloads what that script already wrote.
  function renderDrawingSet(model) {
    const sheets = [];
    for (const level of sortedLevels(model)) sheets.push({ path: `exports/plans/${level.id}.svg`, ...renderPlanSheet(model, level.id) });
    for (const side of ['north', 'east', 'south', 'west']) sheets.push({ path: `exports/elevations/${side}.svg`, ...renderElevationSheet(model, side) });
    for (const section of model.sections ?? []) sheets.push({ path: `exports/sections/${section.id}.svg`, ...renderSectionSheet(model, section.id) });
    for (const level of sortedLevels(model)) sheets.push({ path: `exports/systems/${level.id}.svg`, ...renderPlanSheet(model, level.id, { systems: new Set(Object.keys(DISCIPLINES)) }) });
    return sheets;
  }
  // FNV-1a over canonical model JSON. Lets the viewer tell whether exported drawings are stale.
  function modelFingerprint(model) {
    const text = JSON.stringify(model);
    let hash = 0x811c9dc5;
    for (let i = 0; i < text.length; i += 1) { hash ^= text.charCodeAt(i); hash = Math.imul(hash, 0x01000193) >>> 0; }
    return hash.toString(16).padStart(8, '0');
  }

  function planSvg(includeSystems) {
    return renderPlanSheet(state.model, state.levelId, includeSystems ? { systems: state.systems } : {}).svg;
  }
  function elevationSvg() {
    return renderElevationSheet(state.model, state.elevation).svg;
  }
  function sectionSvg() {
    return renderSectionSheet(state.model, state.sectionId)?.svg ?? '';
  }

  function entityExists(id) {
    return Boolean(id) && allEntityIds(state.model).some(entity => entity.id === id);
  }
  function findingMarkup(severityLabel, title, body, className, entityId) {
    const inner = `<b><span class="severity">${escapeHtml(severityLabel)}</span> · ${escapeHtml(title)}</b><span>${escapeHtml(body)}</span>`;
    return entityExists(entityId)
      ? `<button type="button" class="finding ${className}" data-select="${escapeHtml(entityId)}" aria-label="${escapeHtml(`${severityLabel}: ${title}. Select in drawing`)}">${inner}</button>`
      : `<div class="finding ${className}">${inner}</div>`;
  }

  function renderDocument(kind) {
    if (kind === 'assumptions') {
      const rows = state.model.assumptions.map(item => `<tr data-entity="${escapeHtml(item.id)}" tabindex="0"><td>${escapeHtml(item.topic)}</td><td>${escapeHtml(item.statement)}</td><td>${escapeHtml(item.impact)}</td></tr>`).join('');
      content.innerHTML = `<div class="page"><h1>Assumptions stay attached to the model.</h1><p>Every unresolved fact is listed here instead of disappearing behind finished-looking drawings. Select a row to inspect it.</p>${rows ? `<table><thead><tr><th scope="col">Topic</th><th scope="col">Statement</th><th scope="col">Impact</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty">The model records no assumptions yet. Add them to models/building.json before handoff.</div>'}<div class="disclaimer">Concept only. A licensed architect and the relevant engineering disciplines must verify these assumptions before they inform construction.</div></div>`;
      return;
    }
    const jurisdiction = state.model.project.jurisdiction;
    const report = state.codeReport;
    const reportBody = report.status === 'loaded'
      ? `<h2>Findings</h2>${report.data.findings.map(finding => findingMarkup(finding.status, finding.topic, `${finding.summary} Source: ${finding.authority}, ${finding.sourceTitle} (${finding.sourceRef}; accessed ${finding.accessedDate}).`, finding.status === 'needs-review' ? 'warning' : 'advisory', finding.affectedEntityIds?.[0])).join('') || '<div class="empty">The report contains no findings.</div>'}<h2>Coverage</h2><table><tbody>${Object.entries(report.data.coverage).map(([key, values]) => `<tr><th scope="row">${escapeHtml(key)}</th><td>${escapeHtml(values.join('; ') || 'None recorded')}</td></tr>`).join('')}</tbody></table>`
      : `<h2>Coverage</h2><div class="empty">${escapeHtml(report.message)} Research adopted codes and local amendments from official sources, or attach source documents. Until then, all code-sensitive decisions remain unresolved.</div>`;
    content.innerHTML = `<div class="page"><h1>No compliance claim without evidence.</h1><p>This model targets ${escapeHtml([jurisdiction.locality, jurisdiction.county, jurisdiction.stateOrRegion, jurisdiction.country].filter(Boolean).join(', '))}. Its code review status is <strong>${escapeHtml(jurisdiction.codeReviewStatus)}</strong>.</p>${reportBody}<div class="disclaimer">Advisory only. Confirm interpretations with the authority having jurisdiction and licensed professionals.</div></div>`;
  }

  function selectedEntity() {
    return allEntityIds(state.model).find(entity => entity.id === state.selected) ?? null;
  }

  function renderInspector() {
    const entity = selectedEntity();
    const findings = [...state.findings, ...state.renderWarnings];
    const errors = findings.filter(item => item.severity === 'error');

  function showStageStatus(title, detail) {
    stageStatus.classList.toggle('hidden-view', !title);
    if (title) stageStatus.innerHTML = `<strong>${escapeHtml(title)}</strong><span>${escapeHtml(detail ?? '')}</span>`;
  }
  function select(id) {
    state.selected = id && entityExists(id) ? id : null;
    sheetStage.querySelectorAll?.('[data-entity]').forEach(el => el.classList.toggle('is-selected', el.dataset.entity === state.selected));
    renderInspector();
  }

  function render(options = {}) {
    if (!state.model) return;
    const isSheet = SHEET_VIEWS.includes(state.view), isDocument = DOCUMENT_VIEWS.includes(state.view), isModel = state.view === 'model';
    viewport.classList.toggle('hidden-view', !isSheet);
    canvas.classList.toggle('hidden-view', !isModel);
    content.classList.toggle('hidden-view', !isDocument);
    modelHelp.classList.toggle('hidden-view', !isModel);
    $('#level-control').classList.toggle('hidden-view', !['plan', 'systems'].includes(state.view));
    $('#elevation-control').classList.toggle('hidden-view', state.view !== 'elevation');
    $('#section-control').classList.toggle('hidden-view', state.view !== 'section' || !(state.model.sections ?? []).length);
    $('#zoom-controls').classList.toggle('hidden-view', !isSheet);
    $('#camera-controls').classList.toggle('hidden-view', !isModel);
    $('#system-controls').classList.toggle('hidden-view', !['systems', 'model'].includes(state.view));
    document.querySelectorAll('.tab').forEach(tab => {
      const active = tab.dataset.view === state.view;
      tab.setAttribute('aria-selected', String(active));
      tab.setAttribute('tabindex', active ? '0' : '-1');
      if (active) $('#stage').setAttribute('aria-labelledby', tab.id);
    });
    if (!isSheet) showStageStatus(null);
    if (isSheet) renderSheetView(options.refit);
    else state.renderWarnings = [];
    if (isModel) { if (glState) buildScene(glState); requestAnimationFrame(renderWebGL); }
    if (isDocument) {
      renderDocument(state.view);
      content.querySelectorAll('[data-select]').forEach(button => button.addEventListener('click', () => select(button.dataset.select)));
      content.querySelectorAll('tr[data-entity]').forEach(row => {
        row.addEventListener('click', () => select(row.dataset.entity));
        row.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); select(row.dataset.entity); } });
      });
    }
    renderInspector();
  }

  function setView(view, focusTab) {
    if (!ALL_VIEWS.includes(view)) return;
    const changed = view !== state.view;
    state.view = view;
    render({ refit: changed });
    if (focusTab) $(`#tab-${view}`).focus();
  }

  function wireControls() {
    const tabs = [...document.querySelectorAll('.tab')];
    tabs.forEach(tab => tab.addEventListener('click', () => setView(tab.dataset.view)));
    $('.tabs').addEventListener('keydown', event => {
      const index = tabs.findIndex(tab => tab.dataset.view === state.view);
      const next = { ArrowRight: index + 1, ArrowLeft: index - 1, Home: 0, End: tabs.length - 1 }[event.key];
      if (next === undefined) return;
      event.preventDefault();
      setView(tabs[(next + tabs.length) % tabs.length].dataset.view, true);
    });
    levelSelect.addEventListener('change', () => { state.levelId = levelSelect.value; render(); });
    elevationSelect.addEventListener('change', () => { state.elevation = elevationSelect.value; render({ refit: true }); });
    sectionSelect.addEventListener('change', () => { state.sectionId = sectionSelect.value; render({ refit: true }); });
    $('#zoom-in').addEventListener('click', () => zoomAt(1.25));
    $('#zoom-out').addEventListener('click', () => zoomAt(0.8));
    $('#zoom-fit').addEventListener('click', fitSheet);
    document.querySelectorAll('.system-toggle').forEach(button => button.addEventListener('click', () => {
      const key = button.dataset.system;
      if (state.systems.has(key)) state.systems.delete(key); else state.systems.add(key);
      button.setAttribute('aria-pressed', String(state.systems.has(key)));
      render();
    }));
    const setCamera = mode => {
      state.cameraMode = mode;
      $('#mode-orbit').setAttribute('aria-pressed', String(mode === 'orbit'));
      $('#mode-walk').setAttribute('aria-pressed', String(mode === 'walk'));
      render();
    };
    $('#mode-orbit').addEventListener('click', () => setCamera('orbit'));
    $('#mode-walk').addEventListener('click', () => setCamera('walk'));
    $('#download-set').addEventListener('click', downloadDrawingSet);

    viewport.addEventListener('wheel', event => {
      event.preventDefault();
      const rect = viewport.getBoundingClientRect();
      zoomAt(Math.exp(-event.deltaY * 0.0015), event.clientX - rect.left, event.clientY - rect.top);
    }, { passive: false });
    viewport.addEventListener('pointerdown', event => {
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (pointers.size === 1) dragDistance = 0;
      viewport.setPointerCapture(event.pointerId);
      viewport.classList.add('dragging');
    });
    viewport.addEventListener('pointermove', event => {
      const previous = pointers.get(event.pointerId); if (!previous) return;
      const current = { x: event.clientX, y: event.clientY };
      if (pointers.size === 1) {
        dragDistance += Math.hypot(current.x - previous.x, current.y - previous.y);
        if (dragDistance > 4) panBy(current.x - previous.x, current.y - previous.y);
      } else if (pointers.size === 2) {
        const other = [...pointers.entries()].find(([id]) => id !== event.pointerId)[1];
        const before = Math.hypot(previous.x - other.x, previous.y - other.y), after = Math.hypot(current.x - other.x, current.y - other.y);
        const rect = viewport.getBoundingClientRect();
        if (before > 0) zoomAt(after / before, (current.x + other.x) / 2 - rect.left, (current.y + other.y) / 2 - rect.top);
        dragDistance = Infinity;
      }
      pointers.set(event.pointerId, current);
    });
    const release = event => { pointers.delete(event.pointerId); if (!pointers.size) viewport.classList.remove('dragging'); };
    viewport.addEventListener('pointerup', event => {
      if (pointers.size === 1 && dragDistance <= 4) {
        const target = document.elementFromPoint(event.clientX, event.clientY)?.closest?.('[data-entity]');
        select(target?.dataset.entity ?? null);
      }
      release(event);
    });
    viewport.addEventListener('pointercancel', release);
    viewport.addEventListener('keydown', event => {
      const entity = event.target.closest?.('[data-entity]');
      if (entity && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); select(entity.dataset.entity); return; }
      if (event.key === 'Escape' && state.selected) { select(null); return; }
      const step = 48, moves = { ArrowLeft: [step, 0], ArrowRight: [-step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] };
      if (event.target === viewport && moves[event.key]) { event.preventDefault(); panBy(...moves[event.key]); }
      else if (event.key === '+' || event.key === '=') { event.preventDefault(); zoomAt(1.25); }
      else if (event.key === '-' || event.key === '_') { event.preventDefault(); zoomAt(0.8); }
      else if (event.key === '0') { event.preventDefault(); fitSheet(); }
    });
    window.addEventListener('resize', () => {
      if (SHEET_VIEWS.includes(state.view) && !sheetView.adjusted) fitSheet();
      if (state.view === 'model') renderWebGL();
    });
  }

  async function loadModel(params) {
    const embedded = $('#embedded-model')?.textContent?.trim();
    if (!params.get('model') && embedded) return JSON.parse(embedded);
    const modelPath = params.get('model') || './models/building.json';
    const response = await fetch(modelPath, { cache: 'no-store' });
    if (!response.ok) throw new Error(`Model request failed: ${response.status}`);
    return response.json();
  }

  async function start() {
    try {
      const params = new URLSearchParams(location.search);
      state.model = await loadModel(params);
      const requestedView = params.get('view'); if (ALL_VIEWS.includes(requestedView)) state.view = requestedView;
      const requestedLevel = params.get('level'); state.levelId = state.model.levels.some(level => level.id === requestedLevel) ? requestedLevel : (sortedLevels(state.model)[0]?.id ?? null);
      const requestedSection = params.get('section'); state.sectionId = (state.model.sections ?? []).some(item => item.id === requestedSection) ? requestedSection : (state.model.sections?.[0]?.id ?? null);
      state.findings = validateModel(state.model);
      const codePath = params.get('code') || './reviews/code-findings.json';
      try {
        const codeResponse = await fetch(codePath, { cache: 'no-store' });
        if (codeResponse.ok) {
          const data = await codeResponse.json();
          const valid = data?.schemaVersion === '1.0.0' && data.projectId === state.model.project.id && Array.isArray(data.findings) && data.coverage && ['researched', 'needs-review', 'unavailable'].includes(data.status);
          state.codeReport = valid ? { status: 'loaded', data } : { status: 'invalid', message: 'The advisory code report is malformed or belongs to another project.' };
        } else if (codeResponse.status !== 404) state.codeReport = { status: 'invalid', message: `The advisory code report request failed with status ${codeResponse.status}.` };
      } catch (error) {
        state.codeReport = { status: 'invalid', message: `The advisory code report could not be read: ${error instanceof Error ? error.message : String(error)}` };
      }
      $('#project-name').textContent = state.model.project.name;
      $('#project-meta').textContent = `${state.model.project.status} · ${profileFor(state.model).label}`;
      if (state.findings.some(item => item.severity === 'error')) {
        showStageStatus('Resolve model errors', 'The drawings stay hidden until every model error in the inspector is fixed.');
        renderInspector();
        return;
      }
      levelSelect.innerHTML = sortedLevels(state.model).map(level => `<option value="${escapeHtml(level.id)}"${level.id === state.levelId ? ' selected' : ''}>${escapeHtml(level.name)}</option>`).join('');
      sectionSelect.innerHTML = (state.model.sections ?? []).map(section => `<option value="${escapeHtml(section.id)}"${section.id === state.sectionId ? ' selected' : ''}>${escapeHtml(section.name)}</option>`).join('');
      elevationSelect.value = state.elevation;
      wireControls();
      render({ refit: true });
      loadManifest();
    } catch (error) {
      showStageStatus('Model unavailable', 'Expected a schema-valid model at models/building.json. The studio does not invent fallback geometry.');
      inspector.innerHTML = `<h2>Model unavailable</h2><p class="lede">${escapeHtml(error instanceof Error ? error.message : String(error))}</p><div class="disclaimer">Expected a schema-valid model at <code>models/building.json</code>. The studio will not invent fallback geometry.</div>`;
    }
  }

  const studioApi = {
    state, PROFILES, DISCIPLINES, validateModel, profileFor, selectScale, createPlacer, placeExtent, drawingArea,
    renderPlanSheet, renderElevationSheet, renderSectionSheet, sectionGeometry, renderDrawingSet, modelFingerprint,
    planSvg, elevationSvg, sectionSvg, buildScene, pushPrism, rectangleBounds, renderDocument, zipFiles, crc32, formatLength
  };
  if (typeof globalThis.__OD_STUDIO_TEST__ === 'function') globalThis.__OD_STUDIO_TEST__(studioApi);
  else start();
})();
</script>
</body>
</html>
